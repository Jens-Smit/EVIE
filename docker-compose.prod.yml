# Production docker-compose for EVIE (P1-6).
#
# Nutzt Dockerfile.prod (immutable Image, --no-dev, OPcache, cache:warmup).
# Im Gegensatz zur dev docker-compose.yml gibt es keinen Volume-Mount des
# Source-Codes, keinen Dev-Debug, einen separaten Messenger-Worker-Container,
# Redis (Cache/Rate-Limiter/Mercure) und eine Prod-taugliche Nginx-Config mit
# Resource-Limits.
#
# Usage:
#   APP_SECRET=... MISTRAL_API_KEY=... docker compose -f docker-compose.prod.yml up -d
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: runtime
    container_name: evie_app_prod
    restart: unless-stopped
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - APP_SECRET=${APP_SECRET:?APP_SECRET is required}
      - DATABASE_URL=postgresql://evie:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@postgres:5432/evie?serverVersion=15&charset=utf8
      - PGVECTOR_URL=postgresql://evie:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@postgres:5432/evie?serverVersion=15&charset=utf8
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages?queue_name=async
      - MESSENGER_TRANSPORT_DSN_TOOLS=redis://redis:6379/messages?queue_name=async_tools
      - MESSENGER_TRANSPORT_DSN_STREAMING=redis://redis:6379/messages?queue_name=streaming
      - MESSENGER_TRANSPORT_DSN_HITL=redis://redis:6379/messages?queue_name=hitl_approvals
      - MESSENGER_TRANSPORT_DSN_FAILED=redis://redis:6379/messages?queue_name=failed
      - MCP_FILESYSTEM_URL=http://mcp-filesystem:8123
      - MCP_PLAYWRIGHT_URL=http://mcp-playwright:8931/mcp
      - MAILER_DSN=${MAILER_DSN:-smtp://localhost}
      - MAILER_FROM=${MAILER_FROM:-no-reply@evie.local}
      - MERCURE_URL=http://mercure:80/.well-known/mercure
      - MERCURE_PUBLIC_URL=${MERCURE_PUBLIC_URL:-http://localhost:3000/.well-known/mercure}
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET muss gesetzt sein}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [evie_prod]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  # --- Messenger-Worker (P1-6) -------------------------------------------
  # Asynchrone Verarbeitung ist in funf Transporte aufgeteilt, damit
  # Lastarten isoliert skaliert werden koennen (vgl. config/packages/messenger.yaml):
  #   - async           : Agent-Goals, Mail-Versand (meiste Last)
  #   - async_tools     : Tool-Execution (ExecuteToolMessage)
  #   - streaming       : Streaming-Sessions / Tool-Response-Chunks (fluchtig, keine Retries)
  #   - hitl_approvals   : Human-in-the-Loop-Bestatigungen (weniger Last, manuell)
  #   - failed          : Retries fehlgeschlagener Nachrichten
  # Die Worker nutzen denselben Build wie die App (x-worker-base Anchor).
  worker-async: &worker-base
    # Drei async-Worker fuer Skalierbarkeit & Isolation: an dieser Stelle
    # faellt die meiste Last an (Streaming, Tool-Responses, Mail-Versand).
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: runtime
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "--limit=100", "--memory-limit=128M", "--time-limit=3600"]
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - APP_SECRET=${APP_SECRET:?APP_SECRET is required}
      - DATABASE_URL=postgresql://evie:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@postgres:5432/evie?serverVersion=15&charset=utf8
      - PGVECTOR_URL=postgresql://evie:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@postgres:5432/evie?serverVersion=15&charset=utf8
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages?queue_name=async
      - MESSENGER_TRANSPORT_DSN_TOOLS=redis://redis:6379/messages?queue_name=async_tools
      - MESSENGER_TRANSPORT_DSN_STREAMING=redis://redis:6379/messages?queue_name=streaming
      - MESSENGER_TRANSPORT_DSN_HITL=redis://redis:6379/messages?queue_name=hitl_approvals
      - MESSENGER_TRANSPORT_DSN_FAILED=redis://redis:6379/messages?queue_name=failed
      - MCP_FILESYSTEM_URL=http://mcp-filesystem:8123
      - MCP_PLAYWRIGHT_URL=http://mcp-playwright:8931/mcp
      - MAILER_DSN=${MAILER_DSN:-smtp://localhost}
      - MAILER_FROM=${MAILER_FROM:-no-reply@evie.local}
      - MERCURE_URL=http://mercure:80/.well-known/mercure
      - MERCURE_PUBLIC_URL=${MERCURE_PUBLIC_URL:-http://localhost:3000/.well-known/mercure}
      - MERCURE_JWT_SECRET=${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET muss gesetzt sein}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mercure:
        condition: service_started
    networks: [evie_prod]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  worker-async-2:
    # Zweiter async-Worker fuer erhoehten Durchsatz / Ausfallsicherheit.
    <<: *worker-base
  worker-async-3:
    # Dritter async-Worker; bei Last auf Streaming/Tool-Responses.
    <<: *worker-base
  worker-tools:
    # Drei Tool-Worker pro Job-Queue: isolierte Skalierung der Tool-Execution.
    <<: *worker-base
    command: ["php", "bin/console", "messenger:consume", "async_tools", "--limit=50", "--memory-limit=128M", "--time-limit=3600"]
  worker-streaming:
    # Streaming-Worker fuer Session-/Chunk-Nachrichten (flüchtig, keine Retries).
    <<: *worker-base
    command: ["php", "bin/console", "messenger:consume", "streaming", "--limit=200", "--memory-limit=128M", "--time-limit=1800"]
  worker-hitl:
    # Ein Worker fuer hitl_approvals: HITL-Bestaetigungen sind meist
    # manuell getrieben und lastaermer; ein Prozess reicht aus.
    <<: *worker-base
    command: ["php", "bin/console", "messenger:consume", "hitl_approvals", "--limit=50", "--memory-limit=128M", "--time-limit=3600"]
  worker-failed:
    # Ein Worker ausschliesslich fuer Retries aus der failed-Queue.
    # Laenge Pausen zwischen Retries, damit nicht gegen einen dauerhaft
    # fehlerhaften Dienst gepoltert wird.
    <<: *worker-base
    command: ["php", "bin/console", "messenger:consume", "failed", "--limit=10", "--memory-limit=128M", "--time-limit=3600", "--sleep=30"]
  scheduler:
    # Prod-Scheduler: pollt faellige AgentGoals und dispatcht sie an den
    # Messenger (ersetzt externes Cron, Blueprint Luecke 2 / Phase 5).
    <<: *worker-base
    command: ["php", "bin/console", "app:agent:run-goals", "--loop=60"]

  mercure:
    # Mercure-Hub fuer Echtzeit-Streaming (Blueprint Punkt 4). Pinned auf
    # v0.24.x, weil symfony/mercure v0.8/v0.9 das 0.x-Protokoll nutzt
    # (topic=-Parameter, legacy mercure-JWT-Claim); Mercure 1.0 hat beides
    # entfernt. Prod laeuft ohne dev.Caddyfile (kein anonymes Subscribe,
    # keine Debug-UI) und nur ueber den JWT-Schluessel.
    image: dunglas/mercure:v0.24.2
    container_name: evie_mercure_prod
    restart: unless-stopped
    environment:
      - SERVER_NAME=:80
      - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET muss gesetzt sein}
      - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET muss gesetzt sein}
    ports:
      - "${MERCURE_PORT:-3000}:80"
    volumes:
      - mercure_prod_data:/data
      - mercure_prod_config:/config
    networks: [evie_prod]

  nginx:
    # Prod-Nginx mit eigener Config (kein Dev-default.conf-Mount).
    image: nginx:alpine
    container_name: evie_nginx_prod
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [evie_prod]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  postgres:
    image: pgvector/pgvector:pg15
    container_name: evie_postgres_prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=evie
      - POSTGRES_USER=evie
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evie"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [evie_prod]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  redis:
    # Redis fuer Cache, Rate-Limiter-State und Messenger-Transport.
    image: redis:7-alpine
    container_name: evie_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_prod_data:/data
    networks: [evie_prod]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  evie_prod:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  mercure_prod_data:
  mercure_prod_config:
