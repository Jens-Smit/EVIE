# Production Nginx config for EVIE (P1-6 / Phase 2.3 Performance).
#
# Hardened + performance-tuned:
#   - HTTP/2 (Audit #5: Keine HTTP/2)
#   - Upstream keepalive zum PHP-FPM (Connection Pooling, Audit #4)
#   - Gzip mit erweiterten Settings (Audit #6: Keine Compression)
#   - no server tokens, client_max_body_size, no .git/.env exposure
#
# Timeout-Fixes aus der Log-Analyse:
#   - fastcgi_read_timeout 60s -> 600s: POST /api/agent/dialog verarbeitet
#     AI-/Tool-Ketten, die laenger als 60s laufen koennen (bisher 504).
#   - Vergroesserte FastCGI-Buffer (502-Vermeidung bei grossen JSON-Responses).
#
# Bewusst NICHT enthalten: ein globaler fastcgi_cache. /streaming/sessions
# ist eine authentifizierte, per-User gerenderte Seite (StreamingController::
# listSessions mit #[CurrentUser]); ein shared Cache wuerde Session-Daten
# anderer User ausliefern. Entlastung von Polling-Last erfolgt stattdessen
# an der Quelle (Mercure-SSE statt Polling, Messenger use_notify).

# Upstream mit Keepalive-Verbindungen zum PHP-FPM (Connection Pooling,
# Audit-Finding #4: Vermeidet pro Request einen neuen TCP-Handshake
# zwischen Nginx und PHP-FPM).
upstream evie_php {
    server app:9000;
    keepalive 32;
}

server {
    listen 80;
    # HTTP/2 fuer performance (Audit-Finding #5). Hinweis: echte HTTP/2-
    # Verschluesselung erfordert TLS (listen 443 ssl http2); in dieser
    # Config terminiert ein vorgelagerter Loadbalancer/Proxy das TLS.
    # Falls direkt exponiert: auf 443 mit ssl + http2 umstellen.
    http2 on;
    server_name _;
    root /var/www/html/public;

    # Hide nginx version (security through obscurity baseline).
    server_tokens off;

    # Reasonable upload limit for file-based tool inputs.
    client_max_body_size 10m;

    # Keepalive fuer Client-Verbindungen (vermindert TCP-Handshake-Overhead).
    keepalive_timeout 65s;
    keepalive_requests 100;

    # Gzip compression for text assets (Audit-Finding #6).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/ld+json image/svg+xml;
    gzip_min_length 1024;

    # Deny access to sensitive files (no .env, .git exposure in prod).
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    # Statische Dateien direkt ausliefern (kein PHP-Bootstrap).
    location ~ ^/(assets|builds)/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass evie_php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Timeouts: AI-Anfragen (/api/agent/dialog) koennen deutlich
        # laenger als 60s laufen (Default = 504 Gateway Timeout).
        fastcgi_connect_timeout 30s;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;

        # Vergroesserte Buffer fuer grosse JSON-Antworten (502-Vermeidung).
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_temp_file_write_size 256k;

        # Keepalive zum PHP-FPM nutzen (Connection Pooling, Audit #4).
        fastcgi_keep_conn on;
        fastcgi_buffering on;
    }

    # Fehlerbehandlung: 50x-Statuscodes an Symfony weiterreichen, damit
    # eine ordentliche Fehlerseite statt der leeren Nginx-Default-Seite
    # erscheint (spaeter ggf. um eine statische 50x.html ergaenzbar).
    error_page 500 502 503 504 /index.php;
}
