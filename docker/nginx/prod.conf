# Production Nginx config for EVIE (P1-6).
# Hardened: no server tokens, gzip, sensible client_max_body_size, no .git/.env exposure.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Hide nginx version (security through obscurity baseline).
    server_tokens off;

    # Reasonable upload limit for file-based tool inputs.
    client_max_body_size 10m;

    # Gzip compression for text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Deny access to sensitive files (no .env, .git exposure in prod).
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
    }
}
