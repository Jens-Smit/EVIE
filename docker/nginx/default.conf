# FastCGI-Cache muss im http-Kontext definiert werden.
# Falls diese Datei direkt in /etc/nginx/conf.d/ eingebunden wird,
# kann das nicht innerhalb des server-Blocks stehen.

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # Gzip-Komprimierung
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # PHP
    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;

        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Erhöhte Timeouts
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 60s;
    }

    # EVIE Agent Dialog
    #
    # Wichtig:
    # Diese Location darf nicht einfach die URI als Datei behandeln.
    # Symfony muss über index.php geroutet werden.
    location = /api/agent/dialog {
        try_files $uri /index.php$is_args$args;

        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
        fastcgi_connect_timeout 60s;
    }

    # Streaming Sessions
    location = /streaming/sessions {
        try_files $uri /index.php$is_args$args;
    }

    # Symfony Routing
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Fehlerbehandlung
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /var/www/html/public;
        internal;
    }
}
