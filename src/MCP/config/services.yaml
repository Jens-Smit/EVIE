# src/MCP/config/services.yaml
services:
    # Client & Transport
    App\MCP\Client\MCPClientInterface: ~
    App\MCP\Client\JsonRpcClient: ~

    App\MCP\Transport\TransportInterface: ~
    App\MCP\Transport\HttpTransport:
        arguments:
            $httpClient: '@http_client'
            $timeout: '%evie_mcp.timeout%'

    App\MCP\Transport\StdioTransport:
        arguments:
            $timeout: '%evie_mcp.timeout%'

    # Server & Registry
    App\MCP\Server\ServerManager:
        arguments:
            $httpClient: '@http_client'
            $logger: '@logger'
            $cacheTtl: '%evie_mcp.cache_ttl%'

    App\MCP\Registry\ToolRegistry:
        arguments:
            $serverManager: '@App\MCP\Server\ServerManager'
            $cache: '@cache.app'
            $logger: '@logger'
            $cacheTtl: '%evie_mcp.cache_ttl%'

    App\MCP\Registry\McpToolAdapterFactory:
        arguments:
            $toolRegistry: '@App\MCP\Registry\ToolRegistry'

    App\MCP\Registry\McpToolProvider:
        arguments:
            $adapterFactory: '@App\MCP\Registry\McpToolAdapterFactory'
            $toolRegistry: '@App\MCP\Registry\ToolRegistry'

    # Autoconfiguration für alle MCP-Klassen
    App\MCP\:
        resource: '../'
        exclude: '../{DependencyInjection,config}'
        autowire: true
        autoconfigure: true
