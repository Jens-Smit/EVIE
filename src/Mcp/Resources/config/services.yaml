# MCP Bundle Services
services:
    # MCP Server Manager
    App\Mcp\Client\McpServerManager:
        arguments:
            $serverConfigs: '%evie_mcp.servers%'
            $mcpLogger: '@monolog.logger.mcp'

    # MCP Tool Factory
    App\Mcp\Toolbox\McpToolFactory:
        arguments:
            $serverManager: '@App\Mcp\Client\McpServerManager'
            $cache: '@cache.app'
            $serverAliases: '%evie_mcp.server_aliases%'
            $cacheTtl: '%evie_mcp.cache_ttl%'
            $mcpLogger: '@monolog.logger.mcp'
        tags: ['ai.tool_factory']

    # MCP Tool Executor
    App\Mcp\Toolbox\McpToolExecutor:
        arguments:
            $serverManager: '@App\Mcp\Client\McpServerManager'
            $mcpLogger: '@monolog.logger.mcp'

    # Monolog Logger für MCP
    monolog.logger.mcp:
        parent: monolog.logger
        tags: ['name: mcp']