name: EVIE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: evie_test
          POSTGRES_USER: evie
          POSTGRES_PASSWORD: evie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, ctype, iconv
          coverage: pcov

      - name: Copy .env.dist to .env
        run: cp .env.dist .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U evie; do
            sleep 1
          done

      # ------------------------------------------------------------------
      # E2E auth flows against all three environments (test, dev, prod).
      # Each run uses an isolated in-memory SQLite DB + E2E_TESTING overlay,
      # so no real external services (Mercure, Mistral) are required, yet
      # the full security/form/controller stack of each env is exercised.
      # ------------------------------------------------------------------
      - name: E2E tests (test env)
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
        run: vendor/bin/phpunit --testsuite="E2E Tests"

      - name: E2E tests (dev env)
        env:
          E2E_TESTING: '1'
          APP_ENV: dev
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'sqlite:///:memory:'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: vendor/bin/phpunit --testsuite="E2E Tests"

      - name: E2E tests (prod env)
        env:
          E2E_TESTING: '1'
          APP_ENV: prod
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'sqlite:///:memory:'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: |
          php bin/console cache:warmup --env=prod
          vendor/bin/phpunit --testsuite="E2E Tests"

      # -+
      # E2E Smoke-Tests: Agent/Tool/RAG/HITL/Audit (Blueprint §17)
      # -+
      - name: E2E Smoke tests
        env:
          E2E_TESTING: '1'
          APP_ENV: test
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'sqlite:///:memory:'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: vendor/bin/phpunit --testsuite="E2E Smoke Tests"

      # -+
      # Unit + Integration Tests (Blueprint §7.1/§7.2)
      # ------------------------------------------------------------------
      - name: Unit tests (with coverage)
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
        run: vendor/bin/phpunit --testsuite="EVIE AI Unit Tests" --coverage-clover=coverage-unit.xml
      # ------------------------------------------------------------------
      # Coverage-Reporting (Phase 3 / Audit CI/CD): generiert Clover-Reports
      # und laedt sie als Artefakt hoch.
      # ------------------------------------------------------------------
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-*.xml
          retention-days: 14

      - name: Security tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
        run: vendor/bin/phpunit --testsuite="EVIE AI Security Tests"

      - name: Skills tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
        run: vendor/bin/phpunit --testsuite="EVIE AI Skills Tests"

      - name: Agent tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
        run: vendor/bin/phpunit --testsuite="EVIE AI Agent Tests"

      # -+
      # Functional Tests: kritische Aktionen mit echtem Kernel + LLM-Stub (Blueprint §4.A/§5)
      # ------------------------------------------------------------------
      - name: Functional tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'sqlite:///%kernel.project_dir%/var/test.db'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
          TAVILY_API_KEY: test
        run: vendor/bin/phpunit --testsuite="EVIE AI Functional Tests"

      - name: Integration tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'sqlite:///%kernel.project_dir%/var/test.db'
        run: vendor/bin/phpunit --testsuite="EVIE AI Integration Tests"

      - name: Composer validate
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: Composer audit
        run: composer audit
      # ------------------------------------------------------------------
      # Security Scans (Phase 3 / Audit CI/CD): composer audit prueft auf
      # bekannte CVEs in Abhaengigkeiten. Zusaetzlich wird hier ein
      # no-dev-Audit ausgefuehrt, um auch produktionsrelevante Abhaengigkeiten
      # ohne Dev-Pakete zu scannen.
      # ------------------------------------------------------------------
      - name: Security scan (prod deps)
        run: composer audit --no-dev --format=plain

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --level=5 --no-progress

  # ===================================================================
  # Migrations-Job (P0-A/P0-B): spielt die Doctrine-Migrationskette gegen
  # eine echte, LEERE PostgreSQL-15-Instanz mit pgvector ab und validiert
  # danach, dass das per Migration angelegte Schema mit den Entities
  # uebereinstimmt. Dieser Schritt ist blockierend.
  #
  # Hintergrund: Bisher wurde doctrine:schema:create (aus Entities)
  # ausgefuehrt, das Migrationsfehler auf leerer DB verdeckte. Die alte
  # inkrementelle Kette war nicht von leerer DB replaybar. Mit der neuen
  # Baseline-Migration (Version20260811000000) ist die Kette wieder von
  # Grund auf lauffaehig; dieser Job beweist das.
  # ===================================================================
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: evie_migrate
          POSTGRES_USER: evie
          POSTGRES_PASSWORD: evie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, ctype, iconv
          coverage: pcov

      - name: Copy .env.dist to .env
        run: cp .env.dist .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U evie; do
            sleep 1
          done

      - name: Run migrations against empty PostgreSQL
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: |
          php bin/console cache:warmup --env=prod --no-interaction
          # P0-A/P0-B: Spielt die komplette Migrationskette gegen eine
          # ECHTE, LEERE PostgreSQL-15-Instanz mit pgvector ab. Dies beweist,
          # dass das Repo von Grund auf bootstrappbar ist (Quick-Start aus
          # README). Bisher wurde nur schema:create getestet, das
          # Migrationsfehler auf leerer DB verdeckte.
          php bin/console doctrine:migrations:migrate --env=prod --no-interaction --allow-no-migration

      - name: Validate schema against entities
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        # Stellt sicher, dass das per Migration angelegte Schema exakt mit
        # den aktuellen Doctrine-Entities uebereinstimmt (In-Sync).
        run: php bin/console doctrine:schema:validate --env=prod

      - name: RAG regression test against real PostgreSQL+pgvector
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        # P0-1: Struktureller Regressionstest. Fuegt Test-Zeilen in die
        # embeddings-Tabelle ein und ruft findSimilar() gegen die echte
        # PostgreSQL+pgvector-Instanz auf. Haette sowohl den urspruenglichen
        # Bug (Zyklus 3) als auch die Regression (Zyklus 5) sofort sichtbar
        # gemacht. Verhindert zukuenftige Cast-Regressions blind durch
        # SQLite-Tests.
        run: |
          php bin/console cache:warmup --env=prod --no-interaction
          # Testdaten einfuegen und findSimilar() aufrufen
          php -r "
          require 'vendor/autoload.php';
          use Doctrine\DBAL\DriverManager;
          \$conn = DriverManager::getConnection(['url' => getenv('DATABASE_URL')]);
          \$conn->executeStatement('INSERT INTO embeddings (content_hash, content, content_type, metadata, vector, created_at) VALUES (:hash, :content, :type, :meta, :vec, NOW()) ON CONFLICT DO NOTHING', [
              'hash' => 'test1', 'content' => 'Test content 1', 'type' => 'knowledge', 'meta' => '{}', 'vec' => '[0.1,0.2,0.3]'
          ]);
          \$rows = \$conn->executeQuery('SELECT id, 1 - (vector::text::vector <=> :query::vector) AS similarity FROM embeddings WHERE content_type = :type AND 1 - (vector::text::vector <=> :query::vector) >= 0.5 ORDER BY vector::text::vector <=> :query::vector ASC LIMIT 5', [
              'query' => '[0.1,0.2,0.3]', 'type' => 'knowledge'
          ])->fetchAllAssociative();
          if (count(\$rows) === 0) { echo 'FAIL: findSimilar returned no results' . PHP_EOL; exit(1); }
          echo 'PASS: findSimilar returned ' . count(\$rows) . ' result(s)' . PHP_EOL;
          "

  # ===================================================================
  # E2E-LLM-Job: kritische Aktionen mit echtem Mistral-API-Abruf.
  # Laeuft nur mit gesetzten Secrets (MISTRAL_API_KEY, TAVILY_API_KEY).
  # LLM-Aufrufe sind minimiert: jeder Test macht genau 1 Abruf.
  # Dieser Job ist mit continue-on-error abgesichert, damit Secrets-
  # Abwesenheit den Default-CI-Workflow nicht blockiert; mit Secrets
  # muss er gruen sein.
  # ===================================================================
  e2e-llm:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: evie_test
          POSTGRES_USER: evie
          POSTGRES_PASSWORD: evie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, ctype, iconv
          coverage: pcov
      - name: Copy .env.dist to .env
        run: cp .env.dist .env
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts
      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U evie; do
            sleep 1
          done
      - name: E2E-LLM tests (echte Mistral-Aufrufe, minimiert)
        env:
          EVIE_LLM_E2E: '1'
          APP_ENV: test
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'sqlite:///%kernel.project_dir%/var/test.db'
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: test
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: test
          LINKEDIN_API_TOKEN: test
        run: vendor/bin/phpunit --testsuite="E2E LLM Tests"
