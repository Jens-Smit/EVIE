name: EVIE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: evie_test
          POSTGRES_USER: evie
          POSTGRES_PASSWORD: evie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, ctype, iconv
          coverage: pcov

      - name: Copy .env.dist to .env
        run: cp .env.dist .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U evie; do
            sleep 1
          done

      # ------------------------------------------------------------------
      # E2E auth flows against all three environments (test, dev, prod).
      # Each run uses an isolated in-memory SQLite DB + E2E_TESTING overlay,
      # so no real external services (Mercure, Mistral) are required, yet
      # the full security/form/controller stack of each env is exercised.
      # ------------------------------------------------------------------
      # Alle Test-Schritte laufen gegen die PostgreSQL-Service-Instanz
      # (pgvector/pgvector:pg15) — keine SQLite-Ausnahmen mehr. So wird
      # PostgreSQL-eigenes Verhalten (z.B. Strict-Typen, SERIAL, pgvector)
      # in der CI genauso geprueft wie in Produktion.
      - name: E2E tests (test env)
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
        run: vendor/bin/phpunit --testsuite="E2E Tests" --coverage-clover=coverage-e2e-test.xml

      - name: E2E tests (dev env)
        env:
          E2E_TESTING: '1'
          APP_ENV: dev
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: vendor/bin/phpunit --testsuite="E2E Tests" --coverage-clover=coverage-e2e-dev.xml

      - name: E2E tests (prod env)
        env:
          E2E_TESTING: '1'
          APP_ENV: prod
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: |
          php bin/console cache:warmup --env=prod
          vendor/bin/phpunit --testsuite="E2E Tests" --coverage-clover=coverage-e2e-prod.xml

      # -+
      # E2E Smoke-Tests: Agent/Tool/RAG/HITL/Audit (Blueprint §17)
      # -+
      - name: E2E Smoke tests
        env:
          E2E_TESTING: '1'
          APP_ENV: test
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: vendor/bin/phpunit --testsuite="E2E Smoke Tests" --coverage-clover=coverage-e2e-smoke.xml

      # ------------------------------------------------------------------
      # PRODUCTION SECURITY GATE: Tenant-Isolation, interne Infrastruktur-
      # blockade, HITL vor Seiteneffekten — E2E gegen den echten Kernel.
      # Blockierend: scheitert dieser Gate, ist die App nicht deploy-faehig.
      # ------------------------------------------------------------------
      - name: Production Security Gate (E2E)
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
        run: vendor/bin/phpunit --testsuite="E2E Security Gate Tests" --coverage-clover=coverage-security-gate.xml

      # -+
      # Unit + Integration Tests (Blueprint §7.1/§7.2)
      # ------------------------------------------------------------------
      - name: Application test suite (with coverage)
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
        run: vendor/bin/phpunit --testsuite="Application Test Suite" --coverage-clover=coverage-application.xml
      - name: Unit tests (with coverage)
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
        run: vendor/bin/phpunit --testsuite="EVIE AI Unit Tests" --coverage-clover=coverage-unit.xml

      - name: Security tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
        run: vendor/bin/phpunit --testsuite="EVIE AI Security Tests" --coverage-clover=coverage-security.xml

      - name: Skills tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
        run: vendor/bin/phpunit --testsuite="EVIE AI Skills Tests" --coverage-clover=coverage-skills.xml

      - name: Agent tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
        run: vendor/bin/phpunit --testsuite="EVIE AI Agent Tests" --coverage-clover=coverage-agent.xml

      # -+
      # Functional Tests: kritische Aktionen mit echtem Kernel + LLM-Stub (Blueprint §4.A/§5)
      # ------------------------------------------------------------------
      - name: Functional tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
          TAVILY_API_KEY: test
        run: vendor/bin/phpunit --testsuite="EVIE AI Functional Tests" --coverage-clover=coverage-functional.xml

      - name: Integration tests
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
        run: vendor/bin/phpunit --testsuite="EVIE AI Integration Tests" --coverage-clover=coverage-integration.xml

      # ------------------------------------------------------------------
      # Coverage-Reporting (Blueprint: Unit + Integration + E2E-Abdeckung).
      # Jede Suite schreibt ihren eigenen Clover-Report; dieser Schritt
      # fuehrt alle coverage-*.xml zu einem Gesamt-Report coverage-merged.xml
      # zusammen, in den jede Suite (Unit/Integration/Functional/E2E/Smoke/
      # Security/Skills/Agent) einfliesst. pcov ist oben aktiviert.
      # ------------------------------------------------------------------
      - name: Merge coverage reports
        run: php tests/scripts/merge_clover_coverage.php

      - name: Coverage summary
        run: php tests/scripts/merge_clover_coverage.php --summary coverage-merged.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage-*.xml
          retention-days: 14

      - name: Composer validate
        run: composer validate --strict --no-check-publish 

      - name: Composer audit
        run: composer audit
      # ------------------------------------------------------------------
      # Security Scans (Phase 3 / Audit CI/CD): composer audit prueft auf
      # bekannte CVEs in Abhaengigkeiten. Zusaetzlich wird hier ein
      # no-dev-Audit ausgefuehrt, um auch produktionsrelevante Abhaengigkeiten
      # ohne Dev-Pakete zu scannen.
      # ------------------------------------------------------------------
      - name: Security scan (prod deps)
        run: composer audit --no-dev --format=plain

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --level=5 --no-progress

  # ===================================================================
  # Migrations-Job (P0-A/P0-B): spielt die Doctrine-Migrationskette gegen
  # eine echte, LEERE PostgreSQL-15-Instanz mit pgvector ab und validiert
  # danach, dass das per Migration angelegte Schema mit den Entities
  # uebereinstimmt. Dieser Schritt ist blockierend.
  #
  # Hintergrund: Bisher wurde doctrine:schema:create (aus Entities)
  # ausgefuehrt, das Migrationsfehler auf leerer DB verdeckte. Die alte
  # inkrementelle Kette war nicht von leerer DB replaybar. Mit der neuen
  # Baseline-Migration (Version20260811000000) ist die Kette wieder von
  # Grund auf lauffaehig; dieser Job beweist das.
  # ===================================================================
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: evie_migrate
          POSTGRES_USER: evie
          POSTGRES_PASSWORD: evie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, ctype, iconv
          coverage: pcov

      - name: Copy .env.dist to .env
        run: cp .env.dist .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U evie; do
            sleep 1
          done

      - name: Run migrations against empty PostgreSQL
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: |
          php bin/console cache:warmup --env=prod --no-interaction
          # P0-A/P0-B: Spielt die komplette Migrationskette gegen eine
          # ECHTE, LEERE PostgreSQL-15-Instanz mit pgvector ab. Dies beweist,
          # dass das Repo von Grund auf bootstrappbar ist (Quick-Start aus
          # README). Bisher wurde nur schema:create getestet, das
          # Migrationsfehler auf leerer DB verdeckte.
          php bin/console doctrine:migrations:migrate --env=prod --no-interaction --allow-no-migration
      - name: Set up messenger transports
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        # Die messenger_messages-Tabelle wird vom Messenger-Transport selbst
        # verwaltet (auto_setup) und ist NICHT Teil der Doctrine-Entity-
        # Migrations. Seit symfony/doctrine-messenger registriert der
        # MessengerTransportDoctrineSchemaListener die Tabelle im erwarteten
        # Schema (postGenerateSchema), sodass doctrine:schema:validate sie
        # fordert. Ohne diesen Schritt schlaegt das Validate mit Schema-Drift
        # fehl, weil der Migrations-Job nie eine Message dispatched.
        run: php bin/console messenger:setup-transports --env=prod

      - name: Validate schema against entities
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        # Stellt sicher, dass das per Migration angelegte Schema exakt mit
        # den aktuellen Doctrine-Entities uebereinstimmt (In-Sync).
        run: php bin/console doctrine:schema:validate --env=prod
      # ------------------------------------------------------------------
      # Regressionsschutz fuer den TableNotFoundException-Bug
      # (relation "users" does not exist): Die kritischen Tabellen muessen
      # nach dem Migrations-Run wirklich existieren.
      # ------------------------------------------------------------------
      - name: Assert users and user_profile tables exist
        env:
          PGPASSWORD: evie
        run: |
          psql -h 127.0.0.1 -U evie -d evie_migrate -tAc "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename" > /tmp/tables.txt
          cat /tmp/tables.txt
          grep -qx users /tmp/tables.txt || { echo 'FAIL: Tabelle users fehlt'; exit 1; }
          grep -qx user_profile /tmp/tables.txt || { echo 'FAIL: Tabelle user_profile fehlt'; exit 1; }
          psql -h 127.0.0.1 -U evie -d evie_migrate -tAc "SELECT 1 FROM pg_constraint WHERE lower(conname)=lower('FK_D95AB405A76ED395')" | grep -q 1 || { echo 'FAIL: FK user_profile.user_id -> users.id fehlt'; exit 1; }
      - name: RAG regression test against real PostgreSQL+pgvector
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: |
          php bin/console cache:warmup --env=prod --no-interaction
          php tests/scripts/rag_pgvector_regression_test.php
      # ------------------------------------------------------------------
      # Reproduktion des gemeldeten Fehlerbilds: DB, die von einem alten
      # Kette-Stand nur Sequenzen erhalten hat und in der die Baseline
      # bereits als ausgefuehrt vermerkt ist. Die Reparatur-Migration
      # (Version20260920120000) muss users/user_profile nachbauen.
      # ------------------------------------------------------------------
      - name: Repair broken pre-provisioned database (sequences without tables)
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_migrate?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
          PGPASSWORD: evie
        run: |
          psql -h 127.0.0.1 -U evie -d evie_migrate -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;' > /dev/null
          psql -h 127.0.0.1 -U evie -d evie_migrate -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE SEQUENCE users_id_seq; CREATE SEQUENCE user_profile_id_seq'
          # Defekten Zustand simulieren: alle Migrationen ausser der neuen
          # Reparatur-Migration als bereits ausgefuehrt markieren. Der
          # Metadata-Sync legt die Versions-Tabelle korrekt an.
          php bin/console doctrine:migrations:sync-metadata-storage --env=prod --no-interaction
          for v in Version20260902205052 Version20260903120000 Version20260903130000 Version20260903140000 Version20260903150000 Version20260903160000 Version20260910120000; do
            php bin/console doctrine:migrations:version --add --env=prod --no-interaction "DoctrineMigrations\\$v" || exit 1
          done
          php bin/console cache:warmup --env=prod --no-interaction
          php bin/console doctrine:migrations:migrate --env=prod --no-interaction --allow-no-migration
          psql -h 127.0.0.1 -U evie -d evie_migrate -tAc "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename" > /tmp/tables-repaired.txt
          cat /tmp/tables-repaired.txt
          grep -qx users /tmp/tables-repaired.txt || { echo 'FAIL: Reparatur-Migration hat users nicht erstellt'; exit 1; }
          grep -qx user_profile /tmp/tables-repaired.txt || { echo 'FAIL: Reparatur-Migration hat user_profile nicht erstellt'; exit 1; }


  # ===================================================================
  # E2E-Mercure-Smoke-Tests (Blueprint-Punkt 4): beweisen die ECHTE
  # Publish-Kette mit laufendem dunglas/mercure-Hub (v0.24.x, wie in
  # docker-compose.prod.yml gepinnt): POST /api/streaming/sessions ->
  # Messenger -> Handler-Kette -> StreamingPublisher -> Hub -> SSE-
  # Subscriber (Frontend-Sicht). Zusaetzlich Frontend-Regression: Die
  # Detailseite rendert Hub-URL + Topic + EventSource fuer laufende
  # Sessions (Status-Bug 'active' vs. 'running').
  #
  # Der Hub laeuft als Service-Container mit demselben HS256-Secret wie
  # die App (MERCURE_JWT_SECRET), sodass Publish und Subscribe ueber
  # echte JWTs laufen (kein anonymes Subscribe, produktionsnah).
  # ===================================================================
  e2e-mercure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: evie_test
          POSTGRES_USER: evie
          POSTGRES_PASSWORD: evie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mercure:
        image: dunglas/mercure:v0.24.2
        env:
          SERVER_NAME: :80
          MERCURE_PUBLISHER_JWT_KEY: e2e-mercure-ci-secret-not-for-prod-0123456789
          MERCURE_SUBSCRIBER_JWT_KEY: e2e-mercure-ci-secret-not-for-prod-0123456789
        ports:
          - 3000:80
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, ctype, iconv
          coverage: pcov
      - name: Copy .env.dist to .env
        run: cp .env.dist .env
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts
      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U evie; do
            sleep 1
          done
      - name: Wait for Mercure hub
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/.well-known/mercure?topic=/health" || echo 000)
            # 200 = Hub antwortet (anonymes Subscribe erlaubt), 401 = Hub
            # antwortet und verlangt Subscriber-JWT (produktionsnah). Beides
            # bedeutet: der Hub ist erreichbar.
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "Mercure hub is up (HTTP $code)"
              exit 0
            fi
            sleep 1
          done
          echo "Mercure hub did not become reachable"
          exit 1
      - name: Activate pgvector extension for E2E DB
        run: |
          PGPASSWORD=evie psql -h 127.0.0.1 -U evie -d evie_test -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: E2E Mercure tests (echter Hub, SSE-Subscriber)
        env:
          EVIE_MERCURE_E2E: '1'
          APP_ENV: test
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
          MERCURE_URL: 'http://127.0.0.1:3000/.well-known/mercure'
          MERCURE_PUBLIC_URL: 'http://127.0.0.1:3000/.well-known/mercure'
          MERCURE_JWT_SECRET: e2e-mercure-ci-secret-not-for-prod-0123456789
          MISTRAL_API_KEY: test
          GEMINI_API_KEY: test
        run: vendor/bin/phpunit --testsuite="E2E Mercure Tests" --coverage-clover=coverage-e2e-mercure.xml

  e2e-llm:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: evie_test
          POSTGRES_USER: evie
          POSTGRES_PASSWORD: evie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, ctype, iconv
          coverage: pcov
      - name: Copy .env.dist to .env
        run: cp .env.dist .env
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts
      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U evie; do
            sleep 1
          done
      # pgvector-Extension aktivieren: RealEmbeddingContextE2ETest und die
      # Productive-Workflow-Tests laufen gegen PostgreSQL+pgvector (wie in
      # Produktion), nicht mehr gegen SQLite.
      - name: Activate pgvector extension for E2E DB
        run: |
          PGPASSWORD=evie psql -h 127.0.0.1 -U evie -d evie_test -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: E2E-LLM tests (echte Mistral-Aufrufe, minimiert)
        env:
          EVIE_LLM_E2E: '1'
          APP_ENV: test
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: test
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: test
          LINKEDIN_API_TOKEN: test
        run: vendor/bin/phpunit --testsuite="E2E LLM Tests"
      - name: E2E Productive Workflow Tests (Onboarding, Businessplan, Vertriebsagent, E-Mail-HITL, Postfach, Dokumente, Brainstorming)
        env:
          EVIE_LLM_E2E: '1'
          APP_ENV: test
          APP_SECRET: test-secret-for-evie-1234567890abcdef
          DATABASE_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
          PGVECTOR_URL: 'postgresql://evie:evie@127.0.0.1:5432/evie_test?serverVersion=15&charset=utf8'
          MAILER_DSN: 'null://null'
          MAILER_FROM: 'no-reply@evie.test'
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: test
          TAVILY_API_KEY: test
          FIRECRAWL_API_KEY: test
          LINKEDIN_API_TOKEN: test
        run: vendor/bin/phpunit --testsuite="E2E Productive Workflow Tests"
