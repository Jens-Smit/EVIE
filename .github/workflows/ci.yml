name: EVIE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: evie_test
          POSTGRES_USER: evie
          POSTGRES_PASSWORD: evie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pdo_sqlite, mbstring, ctype, iconv
          coverage: none

      - name: Copy .env.dist to .env
        run: cp .env.dist .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-scripts

      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U evie; do
            sleep 1
          done

      - name: Setup test environment
        env:
          APP_SECRET: test-secret-for-evie-1234567890abcdef
        run: |
          php bin/console cache:clear --env=test --no-warmup
          php bin/console doctrine:schema:create --env=test || true

      - name: Run E2E tests (auth flows)
        run: vendor/bin/phpunit --testsuite="E2E Tests"

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --level=5 || echo "PHPStan completed"
