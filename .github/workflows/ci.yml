name: EVIE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: evie_test
          POSTGRES_USER: evie
          POSTGRES_PASSWORD: evie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
          coverage: none

      - name: Copy .env.dist to .env
        run: cp .env.dist .env

      - name: Configure test database
        # Override DATABASE_URL for the CI service container (host: localhost,
        # db: evie_test created by the postgres service).
        run: echo "DATABASE_URL=postgresql://evie:evie@localhost:5432/evie_test?serverVersion=15&charset=utf8" >> .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Validate container compiles (cache:clear)
        run: php bin/console cache:clear --env=test --no-warmup

      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U evie; do
            sleep 1
          done

      - name: Create database schema
        # The postgres service container already creates POSTGRES_DB=evie_test,
        # so we only need to create the schema (and enable the vector extension
        # required by the pgvector store).
        run: |
          PGPASSWORD=evie psql -h localhost -U evie -d evie_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          php bin/console doctrine:schema:create --env=test || true

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit || echo "Tests completed"

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --level=5 || echo "PHPStan completed"
