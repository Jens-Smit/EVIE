name: PHPUnit Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: evie_db
          MYSQL_USER: db_user
          MYSQL_PASSWORD: db_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, pdo, pdo_mysql
          coverage: none

      - name: Remove composer.lock to force update
        run: rm -f composer.lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Update autoloader
        run: composer dump-autoload

      - name: Ensure bin/console exists
        run: |
          if [ ! -f bin/console ]; then
            mkdir -p bin
            curl -s https://raw.githubusercontent.com/symfony/symfony/6.4/src/Symfony/Bundle/FrameworkBundle/Resources/bin/console -o bin/console
            chmod +x bin/console
          fi

      - name: Wait for MySQL to be ready
        run: |
          while ! mysql -h 127.0.0.1 -P 3306 -u db_user -pdb_password -e "SELECT 1" evie_db; do
            sleep 5
          done
          
      - name: Debug file structure
        run: ls -R

      - name: Create database schema
        run: php $GITHUB_WORKSPACE/bin/console doctrine:schema:create --if-not-exists --no-interaction

      - name: Run PHPUnit tests
        env:
          KERNEL_CLASS: App\Kernel
        run: ./vendor/bin/phpunit

      - name: Run PHPStan analysis
        run: ./vendor/bin/phpstan analyse src --level=3