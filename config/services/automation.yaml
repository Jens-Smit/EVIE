# Automation Services Configuration
# This file configures services for async execution, retry, idempotency, and scheduling

services:
  # Scheduler Service
  App\Service\Automation\SchedulerService:
    arguments:
      $taskRepository: '@App\Repository\Automation\ScheduledTaskRepository'
      $entityManager: '@doctrine.orm.entity_manager'
      $messageBus: '@message_bus'
      $logger: '@logger'
      $defaultTimezone: '%env(default:UTC:SCHEDULER_DEFAULT_TIMEZONE)%'
    tags:
      - { name: 'container.hot_path' }

  # Schedule Validator
  App\Service\Automation\ScheduleValidator:
    arguments:
      $validator: '@validator'
      $defaultTimezone: '%env(default:UTC:SCHEDULER_DEFAULT_TIMEZONE)%'
    tags:
      - { name: 'container.hot_path' }

  # Idempotency Service
  App\Service\Automation\IdempotencyService:
    arguments:
      $executionRepository: '@App\Repository\AI\AgentExecutionRepository'
      $entityManager: '@doctrine.orm.entity_manager'
    tags:
      - { name: 'container.hot_path' }

  # Retry Service
  App\Service\Automation\RetryService:
    arguments:
      $executionRepository: '@App\Repository\AI\AgentExecutionRepository'
      $entityManager: '@doctrine.orm.entity_manager'
      $config: '%env(json:array:RETRY_CONFIG)%'
    tags:
      - { name: 'container.hot_path' }

  # Agent Execution Service (will be implemented in later phases)
  # App\Service\AI\AgentExecutionService:
  #   arguments:
  #     $executionRepository: '@App\Repository\AI\AgentExecutionRepository'
  #     $idempotencyService: '@App\Service\Automation\IdempotencyService'
  #     $retryService: '@App\Service\Automation\RetryService'
  #     $messageBus: '@message_bus'
  #   tags:
  #     - { name: 'container.hot_path' }

  # Task Execution Service (for direct task execution)
