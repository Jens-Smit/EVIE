# Security Services Configuration
# This file configures services for the EVIE security layer

services:
  # Encryption Service
  App\Service\Security\EncryptionService:
    arguments:
      $masterKey: '%env(SECRET_ENCRYPTION_KEY)%'
      $currentVersion: '%env(default:AES-256-GCM-v1:SECRET_ENCRYPTION_VERSION)%'
    tags:
      - { name: 'container.hot_path' }

  # Secret Manager
  App\Service\Security\SecretManager:
    arguments:
      $encryptionService: '@App\Service\Security\EncryptionService'
      $secretRepository: '@App\Repository\Security\UserSecretRepository'
      $entityManager: '@doctrine.orm.entity_manager'
      $currentKeyVersion: '%env(default:KEY_V1:SECRET_KEY_VERSION)%'
    tags:
      - { name: 'container.hot_path' }

