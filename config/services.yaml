services:
    # Default configuration for services in *this* file
    _defaults:
        autowire: true
        autoconfigure: true

    # makes classes in src/ available to be used as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'
            - '../src/AI/Skills/DynamicToolbox.php'

    Symfony\AI\Platform\PlatformInterface: '@ai.platform.mistral'

    # PSR Container Interface → Service Container (für SubAgentFactory)
    Psr\Container\ContainerInterface: '@service_container'

    # RAG Services
    App\AI\Rag\EmbeddingServiceInterface: '@App\AI\Rag\MistralEmbeddingService'

    App\AI\Rag\MistralEmbeddingService:
        arguments:
            $apiKey: '%env(MISTRAL_API_KEY)%'

    # Security Services
    App\Security\UserProvider: ~
    App\Security\UserContext: ~
    # SecurityGuard erhaelt die OutboundRequestPolicy als ergaenzende,
    # DNS-basierte SSRF-Pruefung (Defense-in-Depth in isUrlSafe()).
    App\AI\Security\SecurityGuard:
        arguments:
            $logger: '@logger'
            $outboundRequestPolicy: '@App\AI\Security\OutboundRequestPolicy'
    App\Security\ResetPasswordTokenGenerator: ~

    App\Security\Authenticator\LoginFormAuthenticator:
        arguments:
            $urlGenerator: '@router'
            $entityManager: '@doctrine.orm.entity_manager'

    # AI Skills Services (mit expliziten Argumenten für Autowiring)
    App\AI\Skills\SubAgentPromptResolver:
        arguments:
            $promptDirectory: '%kernel.project_dir%/config/prompts'

    App\AI\Skills\ToolDefinitionGenerator:
        arguments:
            $toolGeneratorAgent: '@ai.agent.tool_generator'

    # OnboardingFlowManager benoetigt den expliziten onboarding-Agent, da
    # autowiring bei mehreren AgentInterface-Services nicht aufloesen kann.
    App\AI\Onboarding\OnboardingFlowManager:
        arguments:
            $onboardingAgent: '@ai.agent.onboarding'

    # Event Listeners
    App\EventListener\ApiSecurityListener:
        tags:
            - { name: kernel.event_listener, event: kernel.controller, priority: 10 }

    App\EventListener\ToolSecurityListener:
        tags:
            - { name: kernel.event_listener, event: kernel.view, priority: 5 }

    # =====================================================================
    # AI Tool Services (Symfony AI 0.12 Tool-Paket-Architektur)
    # Diese Tools sind als Agent-Bridge-Klassen ausgeliefert, aber werden
    # hier als reguläre Services registriert, damit sie über die AI Toolbox
    # via AsTool-Attribut verfügbar sind.
    # =====================================================================
    Symfony\AI\Agent\Bridge\Tavily\Tavily:
        arguments:
            $apiKey: '%env(TAVILY_API_KEY)%'

    # Eigene Tool-Services mit skalaren Konstruktor-Argumenten, die Autowiring nicht
    # auflösen kann - hier explizit per Env-Variable verdrahten.
    # env(default::) stellt sicher, dass cache:clear auch ohne gesetzte .env läuft.
    App\AI\Skills\Tool\LinkedInTool:
        arguments:
            $httpClient: '@http_client'
            $accessToken: '%env(default::LINKEDIN_API_TOKEN)%'

    # OAuthTool fordert Symfony\Component\Cache\Adapter\AdapterInterface, das
    # nicht als Alias im Container registriert ist. Einen konkreten
    # FilesystemAdapter für die Persistenz von OAuth-Token bereitstellen.
    App\AI\Skills\Tool\OAuthTool:
        arguments:
            $cache: '@App\AI\Skills\Tool\OAuthTool\CacheAdapter'

    App\AI\Skills\Tool\OAuthTool\CacheAdapter:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            - 'oauth'            # namespace
            - 3600               # default lifetime
            - '%kernel.cache_dir%/oauth'

    # MCP Server Manager benötigt die Server-Konfiguration als Array
    App\Mcp\Client\McpServerManager:
        arguments:
            $serverConfigs: '%evie_mcp.servers%'

    # =====================================================================
    # P0-3/P0-5 Security & RAG Services
    # =====================================================================
    # OutboundRequestPolicy: robuste SSRF-Abwehr (DNS-Resolution, Redirect-
    # Kontrolle). Wird von SecurityGuard::isUrlSafe() als ergaenzende,
    # DNS-basierte Pruefung aufgerufen (Defense-in-Depth).
    App\AI\Security\OutboundRequestPolicy:
        arguments:
            $logger: '@logger'
            $options:
                allow_private_networks: false
                allow_redirects: false
                max_redirects: 0

    # Secrets-Store Service (Issue #10)
    App\Service\SecretService:
        arguments:
            $secretRepository: '@App\Repository\SecretRepository'
            $kernelSecret: '%kernel.secret%'


    # LLM Platform/Provider Choice (Issue #11)
    App\AI\Platform\PlatformResolver:
        arguments:
            $userProfileRepository: '@App\Repository\UserProfileRepository'
            $mistralPlatform: '@ai.platform.mistral'
            $geminiPlatform: '@ai.platform.gemini'

    App\AI\Platform\ModelResolver:
        arguments:
            $userProfileRepository: '@App\Repository\UserProfileRepository'
            $platformResolver: '@App\AI\Platform\PlatformResolver'

    # Token Quota Service (Issue #16)
    App\Service\QuotaService:
        arguments:
            $quotaRepo: '@App\Repository\TenantQuotaRepository'

    # Quota Decorator
    App\AI\Platform\QuotaDecorator:
        arguments:
            $innerPlatform: '@ai.platform.mistral'
            $quotaRepo: '@App\Repository\TenantQuotaRepository'
            $auditLogger: '@App\AI\Security\AuditLogger'
            $logger: '@logger'
