# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    evie_mcp.cache_ttl: 300
    evie_mcp.servers:
        filesystem:
            transport: 'stdio'
            command: 'npx'
        playwright:
            transport: 'stdio'
            command: 'npx'
        github:
            transport: 'http'
            url: '%env(GITHUB_MCP_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Alias für PlatformInterface → Mistral-Plattform (für Symfony AI Bundle)
    Symfony\AI\Platform\PlatformInterface: '@ai.platform.mistral'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\AI\Skills\DynamicSkillRegistry:
        public: true

    App\AI\Onboarding\ContextStoreManager:
        public: true

    # ========================================================================
    # AI-Agent Services (KORRIGIERT)
    # ========================================================================

    # Orchestrator Dialog Service - EXPLIZITE KONFIGURATION
    App\AI\Agent\OrchestratorDialogService:
        arguments:
            $agent: '@ai.agent.orchestrator'
            $toolGenerator: '@App\AI\Skills\ToolDefinitionGenerator'
            $dispatcher: '@event_dispatcher'
            $logger: '@logger'

    # Tool Definition Generator - EXPLIZITE KONFIGURATION (Autoconfigure entfernt)
    App\AI\Skills\ToolDefinitionGenerator:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $platform: '@ai.platform.mistral'

    # Registrierung des HitlToolCallListener als Event-Listener
    App\AI\Security\HitlToolCallListener:
        tags:
            - { name: 'kernel.event_listener', event: 'Symfony\AI\Agent\Toolbox\Event\ToolCallArgumentsResolved', method: '__invoke' }

    # Registrierung des OnboardingLoader als Service
    App\AI\Loader\OnboardingLoader: ~

    # ToolRegistry als Service
    App\AI\Skills\Tool\ToolRegistry: ~

    # Automatische Registrierung aller Tools mit dem Tag 'ai.tool'
    App\AI\Skills\Tool\:
        resource: '../src/AI/Skills/Tool/'
        tags: ['ai.tool']

    # MCP Services
    App\Mcp\Client\McpServerManager:
        arguments:
            $serverConfigs:
                filesystem:
                    transport: 'stdio'
                    command: 'npx'
                    arguments: ['-y', '!php/const:@modelcontextprotocol/server-filesystem', '%kernel.project_dir%/var/mcp-sandbox']
                playwright:
                    transport: 'stdio'
                    command: 'npx'
                    arguments: ['-y', '!php/const:@modelcontextprotocol/server-playwright']
                github:
                    transport: 'http'
                    url: '%env(GITHUB_MCP_URL)%'

    App\Mcp\Toolbox\McpToolFactory:
        arguments:
            $serverManager: '@App\Mcp\Client\McpServerManager'
            $cache: '@cache.app'
            $serverAliases: ['filesystem', 'playwright', 'github']
            $cacheTtl: '%evie_mcp.cache_ttl%'

    App\Mcp\Toolbox\McpToolFactoryWrapper:
        arguments:
            $mcpToolFactory: '@App\Mcp\Toolbox\McpToolFactory'

    App\Mcp\Toolbox\McpToolExecutor:
        arguments:
            $serverManager: '@App\Mcp\Client\McpServerManager'

    # Evie Toolbox Factory (aktualisiert)
    App\AI\Agent\EvieToolboxFactory:
        arguments:
            $mcpToolFactory: '@App\Mcp\Toolbox\McpToolFactoryWrapper'
            $nativeTools: !tagged_iterator ai.tool
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $dynamicToolFactory: '@App\AI\Skills\Tool\DynamicToolFactory'

    # Sub-Agent Factory (neu implementiert)
    App\AI\Agent\SubAgentFactory:
        arguments:
            $agentFactory: '@ai.agent_factory'
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $logger: '@logger'

    # Dynamic Tool Factory
    App\AI\Skills\Tool\DynamicToolFactory:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $logger: '@logger'
        tags: ['ai.tool']

    # Dynamic Skill Registry
    App\AI\Skills\DynamicSkillRegistry:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'

    # ========================================================================
    # Event Listener
    # ========================================================================

    # Pending Tool Approval Listener
    App\EventListener\PendingToolApprovalListener:
        arguments:
            $notifier: '@notifier'
            $urlGenerator: '@router'
            $logger: '@logger'
        tags:
            - { name: 'kernel.event_listener', event: 'ai.tool.pending_approval', method: 'onPendingToolApproval' }
