services:
    # Default configuration for services in *this* file
    _defaults:
        autowire: true
        autoconfigure: true

    App\Service\AuditLogger: '@App\AI\Security\AuditLogger'
    # makes classes in src/ available to be used as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'
            - '../src/AI/Skills/DynamicToolbox.php'

    Symfony\AI\Platform\PlatformInterface: '@ai.platform.mistral'

    # PSR Container Interface → Service Container (für SubAgentFactory)
    Psr\Container\ContainerInterface: '@service_container'

    # Pro-Tenant API-Key-Aufloesung (Luecke 2): der im Frontend/Onboarding
    # hinterlegte, verschluesselte Mistral-Key wird pro Tenant ausgelesen und
    # ueber die offizielle Symfony-AI-Mistral-Factory in eine eigene Platform
    # gebaut. Ohne Tenant-Secret wird transparent auf die env-basierte
    # Default-Platform (ai.platform.mistral) delegiert. Symfony-AI-kompatibel,
    # keine eigene Bridge, kein Konstruktor-Injection fuer Tools.
    App\AI\Platform\TenantPlatformContext: ~
    App\AI\Platform\TenantAwarePlatform:
        decorates: ai.platform.mistral
        arguments:
            $defaultPlatform: '@.inner'
            $secretService: '@App\Service\SecretService'
            $tenantContext: '@App\AI\Platform\TenantPlatformContext'
            $httpClient: '@http_client'
            $logger: '@logger'

    # RAG Services
    App\AI\Rag\EmbeddingServiceInterface: '@App\AI\Rag\TenantAwareEmbeddingService'

    App\AI\Rag\MistralEmbeddingService:
        arguments:
            $apiKey: '%env(MISTRAL_API_KEY)%'

    # Pro-Tenant API-Keys auch fuer RAG-Embeddings: der im Onboarding
    # hinterlegte Mistral-Key wird pro Tenant aus dem SecretService
    # aufgeloest (analog TenantAwarePlatform); ohne Tenant-Secret wird an
    # die env-basierte Default-Instanz delegiert.
    App\AI\Rag\TenantAwareEmbeddingService:
        arguments:
            $defaultService: '@App\AI\Rag\MistralEmbeddingService'
            $secretService: '@App\Service\SecretService'
            $tenantContext: '@App\AI\Platform\TenantPlatformContext'
            $httpClient: '@http_client'
            $logger: '@logger'

    # Security Services
    App\Security\UserProvider: ~
    App\Security\UserContext: ~
    App\Security\OrganizationContext: ~
    # SecurityGuard erhaelt die OutboundRequestPolicy als ergaenzende,
    # DNS-basierte SSRF-Pruefung (Defense-in-Depth in isUrlSafe()).
    # H-1: fileSandboxRoot schaltet isPathSafe() von einer Blockliste auf
    # ein Allowlist-Sandbox-Root um (Default-Deny). Der Env-Default zeigt auf
    # var/sandbox; nicht gesetzte Env -> null -> Blockliste als Fallback.
    App\AI\Security\SecurityGuard:
        arguments:
            $logger: '@logger'
            $outboundRequestPolicy: '@App\AI\Security\OutboundRequestPolicy'
            $fileSandboxRoot: '%env(default::FILE_SANDBOX_ROOT)%'
    App\Security\ResetPasswordTokenGenerator: ~

    App\Security\Authenticator\LoginFormAuthenticator:
        arguments:
            $urlGenerator: '@router'
            $entityManager: '@doctrine.orm.entity_manager'

    # AI Skills Services (mit expliziten Argumenten für Autowiring)
    App\AI\Skills\SubAgentPromptResolver:
        arguments:
            $promptDirectory: '%kernel.project_dir%/config/prompts'

    # Orchestrator-Pipeline: Planner (Phase 3) laedt den Prompt aus
    # config/prompts/planner.txt (analog SubAgentPromptResolver-Verzeichnis).
    App\AI\Pipeline\Plan\Planner:
        arguments:
            $promptFile: '%kernel.project_dir%/config/prompts/planner.txt'

    # Orchestrator-Pipeline: PipelineInterface -> Pipeline-Implementierung,
    # die die fuenf Phasen Goal -> Intent -> Plan -> Capability -> Execution
    # verdrahtet (autowired via Interfaces). Wird ab Stufe 7 von der
    # OrchestratorDialogService-Fassade und RunAgentGoalHandler konsumiert.
    App\AI\Pipeline\PipelineInterface: '@App\AI\Pipeline\Pipeline'

    App\AI\Skills\ToolDefinitionGenerator:
        arguments:
            $toolGeneratorAgent: '@ai.agent.tool_generator'
            $userContext: '@App\Security\UserContext'

    # OnboardingFlowManager benoetigt den expliziten onboarding-Agent, da
    # autowiring bei mehreren AgentInterface-Services nicht aufloesen kann.
    # Zusaetzlich werden der deterministische StepProvider, der RequirementMapper
    # und der SecretService injiziert, damit der Onboarding-Flow KI-Settings,
    # API-Keys und E-Mail-Verbindungen direkt erfasst.
    App\AI\Onboarding\OnboardingFlowManager:
        arguments:
            $onboardingAgent: '@ai.agent.onboarding'
            $stepProvider: '@App\AI\Onboarding\OnboardingStepProvider'
            $requirementMapper: '@App\AI\Onboarding\IntegrationRequirementMapper'
            $secretService: '@App\Service\SecretService'
            $strategyService: '@App\AI\Onboarding\OnboardingStrategyService'
            $readinessChecker: '@App\AI\Onboarding\OnboardingReadinessChecker'
            $eventDispatcher: '@event_dispatcher'
            $toolDefinitionGenerator: '@App\AI\Skills\ToolDefinitionGenerator'
            $apiKeyValidator: '@App\Service\ApiKeyValidator'
            $tenantPlatformContext: '@App\AI\Platform\TenantPlatformContext'
    App\AI\Onboarding\OnboardingStepProvider: ~
    App\AI\Onboarding\IntegrationRequirementMapper: ~
    # Onboarding-Strategie (Phase C-F): entwirft die initiale Strategie aus
    # dem Brainstorming, persistiert sie als aktive AgentGoal und legt nur
    # Katalog-Sub-Agenten an. Der onboarding-Agent wird explizit verdrahtet
    # (mehrere AgentInterface-Services).
    App\AI\Onboarding\OnboardingStrategyService:
        arguments:
            $onboardingAgent: '@ai.agent.onboarding'
            $tenantPlatformContext: '@App\AI\Platform\TenantPlatformContext'
    App\AI\Onboarding\OnboardingReadinessChecker: ~
    # API-Key-Validierung waehrend Onboarding: echter HTTP-Check gegen die
    # Anbieter-API (Mistral/Gemini/Tavily). Autowired via HttpClientInterface.
    App\Service\ApiKeyValidator:
        arguments:
            $httpClient: '@http_client'

    # Event Listeners
    App\EventListener\ApiSecurityListener:
        tags:
            - { name: kernel.event_listener, event: kernel.controller, priority: 10 }

    App\EventListener\ToolSecurityListener:
        tags:
            - { name: kernel.event_listener, event: kernel.view, priority: 5 }

    # =====================================================================
    # AI Tool Services (Symfony AI 0.12 Tool-Paket-Architektur)
    # Diese Tools sind als Agent-Bridge-Klassen ausgeliefert, aber werden
    # hier als reguläre Services registriert, damit sie über die AI Toolbox
    # via AsTool-Attribut verfügbar sind.
    # =====================================================================
    Symfony\AI\Agent\Bridge\Tavily\Tavily:
        arguments:
            $apiKey: '%env(TAVILY_API_KEY)%'

    # Eigene Tool-Services mit skalaren Konstruktor-Argumenten, die Autowiring nicht
    # auflösen kann - hier explizit per Env-Variable verdrahten.
    # env(default::) stellt sicher, dass cache:clear auch ohne gesetzte .env läuft.
    App\AI\Skills\Tool\LinkedInTool:
        arguments:
            $httpClient: '@http_client'
            $accessToken: '%env(default::LINKEDIN_API_TOKEN)%'
            $outboundRequestPolicy: '@App\AI\Security\OutboundRequestPolicy'

    # OAuthTool fordert Symfony\Component\Cache\Adapter\AdapterInterface, das
    # nicht als Alias im Container registriert ist. Einen konkreten
    # FilesystemAdapter für die Persistenz von OAuth-Token bereitstellen.
    App\AI\Skills\Tool\OAuthTool:
        arguments:
            $cache: '@App\AI\Skills\Tool\OAuthTool\CacheAdapter'
            $outboundRequestPolicy: '@App\AI\Security\OutboundRequestPolicy'

    # H-3: RestApiTool erhaelt die OutboundRequestPolicy, damit jede
    # ausgehende URL vor dem HTTP-Request gegen die SSRF-Richtlinie geprueft wird.
    App\AI\Skills\Tool\RestApiTool:
        arguments:
            $outboundRequestPolicy: '@App\AI\Security\OutboundRequestPolicy'

    App\AI\Skills\Tool\OAuthTool\CacheAdapter:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            - 'oauth'            # namespace
            - 3600               # default lifetime
            - '%kernel.cache_dir%/oauth'

    # MCP Server Manager benötigt die Server-Konfiguration als Array
    App\Mcp\Client\McpServerManager:
        arguments:
            $serverConfigs: '%evie_mcp.servers%'

    # =====================================================================
    # P0-3/P0-5 Security & RAG Services
    # =====================================================================
    # OutboundRequestPolicy: robuste SSRF-Abwehr (DNS-Resolution, Redirect-
    # Kontrolle). Wird von SecurityGuard::isUrlSafe() als ergaenzende,
    # DNS-basierte Pruefung aufgerufen (Defense-in-Depth).
    App\AI\Security\OutboundRequestPolicy:
        arguments:
            $logger: '@logger'
            $options:
                allow_private_networks: false
                allow_redirects: false
                max_redirects: 0

    # Secrets-Store Service (Issue #10)
    App\Service\SecretService:
        arguments:
            $secretRepository: '@App\Repository\SecretRepository'
            $kernelSecret: '%kernel.secret%'

    # =====================================================================
    # HITL E-Mail-Freigabe-Workflow (Blueprint §5) und Inbound-Verarbeitung
    # =====================================================================
    # MailDraftHitlService versendet freigegebene E-Mail-Entwuerfe ueber den
    # Symfony Mailer (Test-Env: null://null, Onboarding erfasst SMTP in prod).
    # Der Absender-Default ist ein PHP-Konstruktor-Default (analog EmailTool),
    # kein %env(...)%-Wiring: "default_mailer_from" ist kein gueltiger
    # Env-Processor-Prefix und wuerde den Container-Build brechen. Im Test-Env
    # ist der Service via services_test.yaml public (E2E-Zugriff).
    App\AI\Workflow\MailDraftHitlService: ~
    # EmailIngestionService nutzt den document_processor-Sub-Agenten (ai.yaml)
    # fuer die LLM-gestuetzte Dokumentenauswertung mit heuristischem Fallback.
    # AgentInterface kann nicht autowired werden (mehrere Agent-Services),
    # deshalb wird der document_processor explizit verdrahtet. Im Test-Env ist
    # der Service via services_test.yaml public (E2E-Zugriff).
    App\AI\Workflow\EmailIngestionService:
        arguments:
            $documentAgent: '@ai.agent.document_processor'


    # LLM Platform/Provider Choice (Issue #11)
    App\AI\Platform\PlatformResolver:
        arguments:
            $userProfileRepository: '@App\Repository\UserProfileRepository'
            $mistralPlatform: '@ai.platform.mistral'
            $geminiPlatform: '@ai.platform.gemini'

    App\AI\Platform\ModelResolver:
        arguments:
            $userProfileRepository: '@App\Repository\UserProfileRepository'
            $platformResolver: '@App\AI\Platform\PlatformResolver'

    # Token Quota Service (Issue #16)
    App\Service\QuotaService:
        arguments:
            $quotaRepo: '@App\Repository\TenantQuotaRepository'

    # Quota Decorator
    App\AI\Platform\QuotaDecorator:
        arguments:
            $innerPlatform: '@ai.platform.mistral'
            $quotaRepo: '@App\Repository\TenantQuotaRepository'
            $auditLogger: '@App\AI\Security\AuditLogger'
            $logger: '@logger'
