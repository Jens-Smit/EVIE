# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    evie_mcp.cache_ttl: 300
    evie_mcp.servers:
        filesystem:
            transport: 'stdio'
            command: 'npx'
        playwright:
            transport: 'stdio'
            command: 'npx'
        github:
            transport: 'http'
            url: '%env(GITHUB_MCP_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Alias für PlatformInterface → Mistral-Plattform (für Symfony AI Bundle)
    Symfony\AI\Platform\PlatformInterface: '@ai.platform.mistral'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\AI\Onboarding\ContextStoreManager:
        public: true

    # ========================================================================
    # AI-Agent Services
    # ========================================================================

    # Orchestrator Dialog Service
    App\AI\Agent\OrchestratorDialogService:
        arguments:
            $agent: '@ai.agent.orchestrator'
            $toolGenerator: '@App\AI\Skills\ToolDefinitionGenerator'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'
            $dispatcher: '@event_dispatcher'
            $logger: '@logger'
            $platform: '@ai.platform.mistral'
            $urlGenerator: '@router'
            $jsonResponseEnforcer: '@App\AI\Response\JsonResponseEnforcer'
            $faultTolerantValidator: '@App\AI\Response\FaultTolerantValidator'
            $responseNormalizer: '@App\AI\Response\ResponseNormalizer'

    # Tool Definition Generator - UPDATED with ToolCategoryRepository
    App\AI\Skills\ToolDefinitionGenerator:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $toolCategoryRepo: '@App\Repository\ToolCategoryRepository'
            $platform: '@ai.platform.mistral'
            $logger: '@logger'

    # Sub-Agent Factory
    App\AI\Agent\SubAgentFactory:
        arguments:
            $platform: '@ai.platform.mistral'
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $logger: '@logger'

    # Dynamic Skill Registry
    App\AI\Skills\DynamicSkillRegistry:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'

    # Dynamic Tool Factory - FIXED: removed $toolRegistry, uses $dynamicSkillRegistry
    App\AI\Skills\Tool\DynamicToolFactory:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $logger: '@logger'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'

    # Tool Registry
    App\AI\Skills\Tool\ToolRegistry: ~

    # Security Guard
    App\AI\Security\SecurityGuard: ~

    # HitlToolCallListener als Event-Listener
    App\AI\Security\HitlToolCallListener:
        tags:
            - { name: 'kernel.event_listener', event: 'Symfony\AI\Agent\Toolbox\Event\ToolCallArgumentsResolved', method: '__invoke' }

    # Registrierung des OnboardingLoader als Service
    App\AI\Loader\OnboardingLoader: ~

    # ========================================================================
    # TOOL SERVICES - Explicit configuration for ALL tools
    # Each tool is configured individually to avoid autowiring issues
    # ========================================================================

    # Weather Tool
    App\AI\Skills\Tool\WeatherTool:
        tags: ['ai.tool']

    # File Read Tool
    App\AI\Skills\Tool\FileReadTool:
        tags: ['ai.tool']

    # Data Analyzer Tool
    App\AI\Skills\Tool\DataAnalyzerTool:
        tags: ['ai.tool']

    # Excel Parser Tool
    App\AI\Skills\Tool\ExcelParserTool:
        tags: ['ai.tool']

    # User Type Lookup Tool
    App\AI\Skills\Tool\UserTypeLookupTool:
        tags: ['ai.tool']

    # Email Tool - requires MailerInterface
    App\AI\Skills\Tool\EmailTool:
        arguments:
            $mailer: '@mailer'
            $defaultFrom: 'noreply@evie.ai'
        tags: ['ai.tool']

    # LinkedIn Tool - requires LINKEDIN_API_TOKEN environment variable
    App\AI\Skills\Tool\LinkedInTool:
        arguments:
            $httpClient: '@http_client'
            $accessToken: '%env(LINKEDIN_API_TOKEN)%'
        tags: ['ai.tool']

    # OAuth Tool - for OAuth 2.0 authentication
    App\AI\Skills\Tool\OAuthTool:
        arguments:
            $httpClient: '@http_client'
            $cache: '@cache.app'
        tags: ['ai.tool']

    # REST API Tool - for generic REST API requests
    App\AI\Skills\Tool\RestApiTool:
        arguments:
            $httpClient: '@http_client'
        tags: ['ai.tool']

    # Generic Tool Executor
    App\AI\Skills\Executor\GenericToolExecutor:
        arguments:
            $toolRegistry: '@App\AI\Skills\Tool\ToolRegistry'
            $securityGuard: '@App\AI\Security\SecurityGuard'
        tags: ['ai.tool']

    # Dynamic Tool Dispatcher
    App\AI\Skills\Tool\DynamicToolDispatcher:
        arguments:
            $skillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $securityGuard: '@App\AI\Security\SecurityGuard'
        tags: ['ai.tool']

    # ========================================================================
    # MCP Tools
    # ========================================================================

    # Firecrawl Tool (Web-Scraping)
    Symfony\AI\Agent\Bridge\Firecrawl\Firecrawl:
        arguments:
            $apiKey: '%env(FIRECRAWL_API_KEY)%'
            $endpoint: 'https://api.firecrawl.dev'
        tags: ['ai.tool']

    # Tavily Tool (Web-Suche)
    Symfony\AI\Agent\Bridge\Tavily\Tavily:
        arguments:
            $apiKey: '%env(TAVILY_API_KEY)%'
        tags: ['ai.tool']

    # ========================================================================
    # Strategy & Workflow Services
    # ========================================================================

    App\AI\Strategy\StrategyManager:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'
            $platform: '@ai.platform.mistral'
            $logger: '@logger'

    App\AI\Workflow\WorkflowOrchestrator:
        arguments:
            $strategyManager: '@App\AI\Strategy\StrategyManager'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'
            $historyRepo: '@App\Repository\AgentHistoryRepository'
            $logger: '@logger'

    # ========================================================================
    # Decision & Briefing Services
    # ========================================================================

    App\AI\Decision\DecisionManager:
        arguments:
            $decisionLogRepo: '@App\Repository\DecisionLogRepository'
            $logger: '@logger'

    App\AI\Briefing\BriefingManager:
        arguments:
            $historyRepo: '@App\Repository\AgentHistoryRepository'
            $decisionManager: '@App\AI\Decision\DecisionManager'
            $workflowOrchestrator: '@App\AI\Workflow\WorkflowOrchestrator'
            $logger: '@logger'

    # ========================================================================
    # MCP Services
    # ========================================================================

    App\Mcp\Client\McpServerManager:
        arguments:
            $serverConfigs:
                filesystem:
                    transport: 'stdio'
                    command: 'npx'
                    arguments: ['-y', '!php/const:@modelcontextprotocol/server-filesystem', '%kernel.project_dir%/var/mcp-sandbox']
                playwright:
                    transport: 'stdio'
                    command: 'npx'
                    arguments: ['-y', '!php/const:@modelcontextprotocol/server-playwright']
                github:
                    transport: 'http'
                    url: '%env(GITHUB_MCP_URL)%'

    App\Mcp\Toolbox\McpToolFactory:
        arguments:
            $serverManager: '@App\Mcp\Client\McpServerManager'
            $cache: '@cache.app'
            $serverAliases: ['filesystem', 'playwright', 'github']
            $cacheTtl: '%evie_mcp.cache_ttl%'

    App\Mcp\Toolbox\McpToolFactoryWrapper:
        arguments:
            $mcpToolFactory: '@App\Mcp\Toolbox\McpToolFactory'

    App\Mcp\Toolbox\McpToolExecutor:
        arguments:
            $serverManager: '@App\Mcp\Client\McpServerManager'
            $serverAliases: ['filesystem', 'playwright', 'github']

    # ========================================================================
    # Toolbox Factory
    # ========================================================================

    App\AI\Agent\EvieToolboxFactory:
        arguments:
            $mcpToolFactory: '@App\Mcp\Toolbox\McpToolFactoryWrapper'
            $nativeTools: !tagged_iterator ai.tool
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'

    # ========================================================================
    # Event Listener
    # ========================================================================

    App\EventListener\PendingToolApprovalListener:
        arguments:
            $notifier: '@notifier'
            $urlGenerator: '@router'
            $logger: '@logger'
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
        tags:
            - { name: 'kernel.event_listener', event: 'ai.tool.pending_approval', method: 'onPendingToolApproval' }
            - { name: 'kernel.event_listener', event: 'ai.tool.approved', method: 'onToolApproved' }

    # ========================================================================
    # Controller Services
    # ========================================================================

    App\Controller\ToolApprovalController:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $dispatcher: '@event_dispatcher'
            $urlGenerator: '@router'
            $logger: '@logger'
        tags: ['controller.service_arguments']

    App\Controller\BriefingController:
        arguments:
            $briefingManager: '@App\AI\Briefing\BriefingManager'
        tags: ['controller.service_arguments']

    App\Controller\DecisionController:
        arguments:
            $decisionManager: '@App\AI\Decision\DecisionManager'
        tags: ['controller.service_arguments']

    # ========================================================================
    # JSON Response Enforcer
    # ========================================================================
    App\AI\Response\JsonResponseEnforcer:
        arguments:
            $platform: '@ai.platform.mistral'
            $logger: '@logger'
            $responseNormalizer: '@App\AI\Response\ResponseNormalizer'
        tags: ['container.hot_path']

    App\AI\Response\ResponseNormalizer:
        arguments:
            $logger: '@logger'
        tags: ['container.hot_path']

    App\AI\Response\FaultTolerantValidator:
        arguments:
            $logger: '@logger'
            $responseNormalizer: '@App\AI\Response\ResponseNormalizer'
        tags: ['container.hot_path']

    # ========================================================================
    # Sub-Agent Dispatcher
    # ========================================================================
    App\AI\Agent\SubAgentDispatcher:
        arguments:
            $platform: '@ai.platform.mistral'
            $logger: '@logger'
            $jsonResponseEnforcer: '@App\AI\Response\JsonResponseEnforcer'
            $faultTolerantValidator: '@App\AI\Response\FaultTolerantValidator'
            $toolGenerator: '@App\AI\Skills\ToolDefinitionGenerator'
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $dispatcher: '@event_dispatcher'
            $urlGenerator: '@router'
            $firecrawl: '@Symfony\AI\Agent\Bridge\Firecrawl\Firecrawl'
            $tavily: '@Symfony\AI\Agent\Bridge\Tavily\Tavily'
        tags: ['container.hot_path']

    # ========================================================================
    # Response Pipeline
    # ========================================================================
    App\AI\Response\ResponsePipeline:
        arguments:
            $logger: '@logger'
            $jsonResponseEnforcer: '@App\AI\Response\JsonResponseEnforcer'
            $responseNormalizer: '@App\AI\Response\ResponseNormalizer'
            $faultTolerantValidator: '@App\AI\Response\FaultTolerantValidator'
        tags: ['container.hot_path']
