# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    evie_mcp.cache_ttl: 300
    
    # ========================================================================
    # SecurityGuard Whitelist-Konfiguration
    # ========================================================================
    evie.security.allowed_services:
        # Standardmäßig erlaubte EVIE Tools
        - 'App\AI\Skills\Tool\GenericApiExecutor'
        - 'App\AI\Skills\Tool\FileSystemReadExecutor'
        - 'App\AI\Skills\Tool\FileSystemWriteExecutor'
        - 'App\AI\Skills\Tool\DatabaseQueryExecutor'
        - 'App\AI\Skills\Tool\HttpClientExecutor'
        - 'App\AI\Skills\Tool\WeatherTool'
        - 'App\AI\Skills\Tool\FileReadTool'
        - 'App\AI\Skills\Tool\DataAnalyzerTool'
        - 'App\AI\Skills\Tool\ExcelParserTool'
        - 'App\AI\Skills\Tool\UserTypeLookupTool'
        - 'App\AI\Skills\Tool\EmailTool'
        - 'App\AI\Skills\Tool\LinkedInTool'
        - 'App\AI\Skills\Tool\OAuthTool'
        - 'App\AI\Skills\Tool\RestApiTool'
        - 'App\AI\Skills\Tool\DynamicToolExecutor'
        - 'App\AI\Skills\Tool\DynamicToolDispatcher'
        
        # Symfony AI Bundle Tools
        - 'Symfony\AI\Agent\Bridge\Wikipedia\Wikipedia'
        - 'Symfony\AI\Agent\Bridge\Firecrawl\Firecrawl'
        - 'Symfony\AI\Agent\Bridge\Tavily\Tavily'
        
        # Wildcard für alle EVIE Tools (falls nicht explizit aufgelistet)
        - 'App\AI\Skills\Tool\*'
    
    evie.security.blocked_patterns:
        # Lokale Server
        - 'localhost'
        - '127.0.0.1'
        
        # Sensible Verzeichnisse
        - '/etc/'
        - '/root/'
        - '/var/'
        - '/bin/'
        - '/sbin/'
        - '/proc/'
        - '/dev/'
        - '/boot/'
        
        # Sensible Dateien
        - '*.env'
        - '*.env.'
        - '*.pem'
        - '*.key'
        - '*.crt'
        - '*.p12'
        - '*.pfx'
        - 'composer.json'
        - 'composer.lock'
        - 'package.json'
        - 'package-lock.json'
        - '.git/'
        - '.github/'
        
        # Datenbank-Verbindungen
        - 'mysql:'
        - 'postgresql:'
        - 'sqlite:'
        - 'mongodb:'
        - 'redis:'
        
        # Interne Netzwerke
        - '192.168.'
        - '10.'
        - '172.16.'
        - '172.17.'
        - '172.18.'
        - '172.19.'
        - '172.20.'
        - '172.21.'
        - '172.22.'
        - '172.23.'
        - '172.24.'
        - '172.25.'
        - '172.26.'
        - '172.27.'
        - '172.28.'
        - '172.29.'
        - '172.30.'
        - '172.31.'
        
        # Externe Services (nur über erlaubte APIs)
        - 'http://localhost'
        - 'https://localhost'
        - 'http://127.0.0.1'
        - 'https://127.0.0.1'

    evie_mcp.servers:
        filesystem:
            transport: 'stdio'
            command: 'npx'
        playwright:
            transport: 'stdio'
            command: 'npx'
        github:
            transport: 'http'
            url: '%env(GITHUB_MCP_URL)%'

    # Genehmigte Tool-IDs für CompilerPass (wird zur Compile-Time verwendet)
    # In einer echten Implementierung: Cache-Warmup-Command füllt diesen Parameter
    evie.dynamic_tools.approved: []

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Alias für PlatformInterface → Mistral-Plattform (für Symfony AI Bundle)
    Symfony\AI\Platform\PlatformInterface: '@ai.platform.mistral'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\AI\Onboarding\ContextStoreManager:
        public: true

    # ========================================================================
    # AI-Agent Services
    # ========================================================================

    # Orchestrator Dialog Service
    App\AI\Agent\OrchestratorDialogService:
        arguments:
            $agent: '@ai.agent.orchestrator'
            $toolGenerator: '@App\AI\Skills\ToolDefinitionGenerator'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'
            $dispatcher: '@event_dispatcher'
            $logger: '@logger'
            $platform: '@ai.platform.mistral'
            $urlGenerator: '@router'
            $jsonResponseEnforcer: '@App\AI\Response\JsonResponseEnforcer'
            $faultTolerantValidator: '@App\AI\Response\FaultTolerantValidator'
            $responseNormalizer: '@App\AI\Response\ResponseNormalizer'
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'

    # Tool Definition Generator - UPDATED with ToolCategoryRepository
    App\AI\Skills\ToolDefinitionGenerator:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $toolCategoryRepo: '@App\Repository\ToolCategoryRepository'
            $platform: '@ai.platform.mistral'
            $logger: '@logger'

    # Sub-Agent Factory
    App\AI\Agent\SubAgentFactory:
        arguments:
            $platform: '@ai.platform.mistral'
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $logger: '@logger'

    # ========================================================================
    # Security Services
    # ========================================================================

    # SecurityGuard mit ParameterBag-Integration
    App\AI\Security\SecurityGuard:
        arguments:
            $params: '@parameter_bag'

    # HitlInterceptor mit SecurityGuard-Integration
    App\AI\Security\HitlInterceptor:
        arguments:
            $eventDispatcher: '@event_dispatcher'
            $securityGuard: '@App\AI\Security\SecurityGuard'

    # HitlToolCallListener als Event-Listener
    App\AI\Security\HitlToolCallListener:
        arguments:
            $securityGuard: '@App\AI\Security\SecurityGuard'
        tags:
            - { name: 'kernel.event_listener', event: 'Symfony\AI\Agent\Toolbox\Event\ToolCallArgumentsResolved', method: '__invoke' }

    # ========================================================================
    # Dynamic Skill Registry & Tools
    # ========================================================================

    # Dynamic Skill Registry - UPDATED mit DynamicToolFactory
    App\AI\Skills\DynamicSkillRegistry:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $toolFactory: '@App\AI\Skills\Tool\DynamicToolFactory'
            $toolRegistry: '@ai.agent.tool_registry'  # Symfony AI Bundle ToolRegistry

    # Dynamic Tool Factory - UPDATED mit SecurityGuard und Container
    App\AI\Skills\Tool\DynamicToolFactory:
        arguments:
            $container: '@service_container'
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $logger: '@logger'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $securityGuard: '@App\AI\Security\SecurityGuard'

    # Dynamic Tool Executor
    App\AI\Skills\Tool\DynamicToolExecutor:
        arguments:
            $container: '@service_container'
            $securityGuard: '@App\AI\Security\SecurityGuard'
            $logger: '@logger'

    # Tool Registry (Symfony AI Bundle)
    App\AI\Skills\Tool\ToolRegistry: ~

    # Registrierung des OnboardingLoader als Service
    App\AI\Loader\OnboardingLoader: ~

    # ========================================================================
    # CompilerPass Registration
    # ========================================================================

    # AiDynamicToolsCompilerPass für dynamische Tool-Registrierung
    App\DependencyInjection\Compiler\AiDynamicToolsCompilerPass:
        tags:
            - { name: 'container.compiler_pass' }

    # ========================================================================
    # Cache Warmup Command
    # ========================================================================

    # WarmupDynamicToolsCacheCommand für CompilerPass-Unterstützung
    App\Command\WarmupDynamicToolsCacheCommand:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
        tags:
            - { name: 'console.command' }

    # ========================================================================
    # TOOL SERVICES - Explicit configuration for ALL tools
    # Each tool is configured individually to avoid autowiring issues
    # ========================================================================

    # Weather Tool
    App\AI\Skills\Tool\WeatherTool:
        tags: ['ai.tool']

    # File Read Tool
    App\AI\Skills\Tool\FileReadTool:
        tags: ['ai.tool']

    # Data Analyzer Tool
    App\AI\Skills\Tool\DataAnalyzerTool:
        tags: ['ai.tool']

    # Excel Parser Tool
    App\AI\Skills\Tool\ExcelParserTool:
        tags: ['ai.tool']

    # User Type Lookup Tool
    App\AI\Skills\Tool\UserTypeLookupTool:
        tags: ['ai.tool']

    # Email Tool - requires MailerInterface
    App\AI\Skills\Tool\EmailTool:
        arguments:
            $mailer: '@mailer'
            $defaultFrom: 'noreply@evie.ai'
        tags: ['ai.tool']

    # LinkedIn Tool - requires LINKEDIN_API_TOKEN environment variable
    App\AI\Skills\Tool\LinkedInTool:
        arguments:
            $httpClient: '@http_client'
            $accessToken: '%env(LINKEDIN_API_TOKEN)%'
        tags: ['ai.tool']

    # OAuth Tool - for OAuth 2.0 authentication
    App\AI\Skills\Tool\OAuthTool:
        arguments:
            $httpClient: '@http_client'
            $cache: '@cache.app'
        tags: ['ai.tool']

    # REST API Tool - for generic REST API requests
    App\AI\Skills\Tool\RestApiTool:
        arguments:
            $httpClient: '@http_client'
        tags: ['ai.tool']

    # Generic Tool Executor
    App\AI\Skills\Executor\GenericToolExecutor:
        arguments:
            $toolRegistry: '@App\AI\Skills\Tool\ToolRegistry'
            $securityGuard: '@App\AI\Security\SecurityGuard'
        tags: ['ai.tool']

    # Dynamic Tool Dispatcher
    App\AI\Skills\Tool\DynamicToolDispatcher:
        arguments:
            $skillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $securityGuard: '@App\AI\Security\SecurityGuard'
        tags: ['ai.tool']

    # ========================================================================
    # MCP Tools
    # ========================================================================

    # Firecrawl Tool (Web-Scraping)
    Symfony\AI\Agent\Bridge\Firecrawl\Firecrawl:
        arguments:
            $apiKey: '%env(FIRECRAWL_API_KEY)%'
            $endpoint: 'https://api.firecrawl.dev'
        tags: ['ai.tool']

    # Tavily Tool (Web-Suche)
    Symfony\AI\Agent\Bridge\Tavily\Tavily:
        arguments:
            $apiKey: '%env(TAVILY_API_KEY)%'
        tags: ['ai.tool']

    # ========================================================================
    # Strategy & Workflow Services
    # ========================================================================

    App\AI\Strategy\StrategyManager:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'
            $platform: '@ai.platform.mistral'
            $logger: '@logger'

    App\AI\Workflow\WorkflowOrchestrator:
        arguments:
            $strategyManager: '@App\AI\Strategy\StrategyManager'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'
            $historyRepo: '@App\Repository\AgentHistoryRepository'
            $logger: '@logger'

    # ========================================================================
    # Decision & Briefing Services
    # ========================================================================

    App\AI\Decision\DecisionManager:
        arguments:
            $decisionLogRepo: '@App\Repository\DecisionLogRepository'
            $logger: '@logger'

    App\AI\Briefing\BriefingManager:
        arguments:
            $historyRepo: '@App\Repository\AgentHistoryRepository'
            $decisionManager: '@App\AI\Decision\DecisionManager'
            $workflowOrchestrator: '@App\AI\Workflow\WorkflowOrchestrator'
            $logger: '@logger'

    # ========================================================================
    # MCP Services
    # ========================================================================

    App\Mcp\Client\McpServerManager:
        arguments:
            $serverConfigs:
                filesystem:
                    transport: 'stdio'
                    command: 'npx'
                    arguments: ['-y', '!php/const:@modelcontextprotocol/server-filesystem', '%kernel.project_dir%/var/mcp-sandbox']
                playwright:
                    transport: 'stdio'
                    command: 'npx'
                    arguments: ['-y', '!php/const:@modelcontextprotocol/server-playwright']
                github:
                    transport: 'http'
                    url: '%env(GITHUB_MCP_URL)%'

    App\Mcp\Toolbox\McpToolFactory:
        arguments:
            $serverManager: '@App\Mcp\Client\McpServerManager'
            $cache: '@cache.app'
            $serverAliases: ['filesystem', 'playwright', 'github']
            $cacheTtl: '%evie_mcp.cache_ttl%'

    App\Mcp\Toolbox\McpToolFactoryWrapper:
        arguments:
            $mcpToolFactory: '@App\Mcp\Toolbox\McpToolFactory'

    App\Mcp\Toolbox\McpToolExecutor:
        arguments:
            $serverManager: '@App\Mcp\Client\McpServerManager'
            $serverAliases: ['filesystem', 'playwright', 'github']

    # ========================================================================
    # Toolbox Factory
    # ========================================================================

    App\AI\Agent\EvieToolboxFactory:
        arguments:
            $mcpToolFactory: '@App\Mcp\Toolbox\McpToolFactoryWrapper'
            $nativeTools: !tagged_iterator ai.tool
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'

    # ========================================================================
    # Event Listener
    # ========================================================================

    App\EventListener\PendingToolApprovalListener:
        arguments:
            $notifier: '@notifier'
            $urlGenerator: '@router'
            $logger: '@logger'
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
        tags:
            - { name: 'kernel.event_listener', event: 'ai.tool.pending_approval', method: 'onPendingToolApproval' }
            - { name: 'kernel.event_listener', event: 'ai.tool.approved', method: 'onToolApproved' }

    # Sidebar Badge Listener - calculates dynamic badge counts
    App\EventListener\SidebarBadgeListener:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $historyRepo: '@App\Repository\AgentHistoryRepository'
            $twig: '@twig'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.controller', method: 'onKernelController', priority: 10 }

    # ========================================================================
    # Controller Services
    # ========================================================================

    App\Controller\ToolApprovalController:
        arguments:
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $dynamicSkillRegistry: '@App\AI\Skills\DynamicSkillRegistry'
            $dispatcher: '@event_dispatcher'
            $urlGenerator: '@router'
            $logger: '@logger'
        tags: ['controller.service_arguments']

    App\Controller\BriefingController:
        arguments:
            $briefingManager: '@App\AI\Briefing\BriefingManager'
        tags: ['controller.service_arguments']

    App\Controller\DecisionController:
        arguments:
            $decisionManager: '@App\AI\Decision\DecisionManager'
        tags: ['controller.service_arguments']

    App\Controller\SubAgentListController:
        arguments:
            $subAgentFactory: '@App\AI\Agent\SubAgentFactory'
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $entityManager: '@doctrine.orm.entity_manager'
        tags: ['controller.service_arguments']

    # ========================================================================
    # JSON Response Enforcer
    # ========================================================================
    App\AI\Response\JsonResponseEnforcer:
        arguments:
            $platform: '@ai.platform.mistral'
            $logger: '@logger'
            $responseNormalizer: '@App\AI\Response\ResponseNormalizer'
        tags: ['container.hot_path']

    App\AI\Response\ResponseNormalizer:
        arguments:
            $logger: '@logger'
        tags: ['container.hot_path']

    App\AI\Response\FaultTolerantValidator:
        arguments:
            $logger: '@logger'
            $responseNormalizer: '@App\AI\Response\ResponseNormalizer'
        tags: ['container.hot_path']

    # ========================================================================
    # Sub-Agent Dispatcher
    # ========================================================================
    App\AI\Agent\SubAgentDispatcher:
        arguments:
            $platform: '@ai.platform.mistral'
            $logger: '@logger'
            $jsonResponseEnforcer: '@App\AI\Response\JsonResponseEnforcer'
            $faultTolerantValidator: '@App\AI\Response\FaultTolerantValidator'
            $toolGenerator: '@App\AI\Skills\ToolDefinitionGenerator'
            $toolDefinitionRepo: '@App\Repository\ToolDefinitionRepository'
            $dispatcher: '@event_dispatcher'
            $urlGenerator: '@router'
            $firecrawl: '@Symfony\AI\Agent\Bridge\Firecrawl\Firecrawl'
            $tavily: '@Symfony\AI\Agent\Bridge\Tavily\Tavily'
        tags: ['container.hot_path']

    # ========================================================================
    # Response Pipeline
    # ========================================================================
    App\AI\Response\ResponsePipeline:
        arguments:
            $logger: '@logger'
            $jsonResponseEnforcer: '@App\AI\Response\JsonResponseEnforcer'
            $responseNormalizer: '@App\AI\Response\ResponseNormalizer'
            $faultTolerantValidator: '@App\AI\Response\FaultTolerantValidator'
        tags: ['container.hot_path']
