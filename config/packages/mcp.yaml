mcp:
    # App-Metadaten
    app: 'evie'
    version: '1.0.0'
    description: 'EVIE - Selbst-evolvierender AI-Agent mit MCP-Fähigkeiten'
    website_url: 'https://github.com/Jens-Smit/EVIE'

    # Client-Transports für MCP-Server
    client_transports:
        # Playwright-MCP (Browser-Automatisierung)
        playwright:
            transport: 'http'
            http:
                url: 'http://mcp-playwright:3000'

        # Filesystem-MCP (Dateisystem-Zugriff)
        filesystem:
            transport: 'http'
            http:
                url: 'http://mcp-filesystem:3000'
