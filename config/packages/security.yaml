security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        
        # OAuth User Provider - laedt Benutzer aus der Datenbank
        oauth_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\Authenticator\LoginFormAuthenticator
                - App\Security\Authenticator\OAuthAuthenticator
            entry_point: App\Security\Authenticator\LoginEntryPoint

            logout:
                path: app_logout
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/datenschutz, roles: PUBLIC_ACCESS }
        - { path: ^/impressum, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        
        # OAuth Routes - muessen oeffentlich zugaenglich sein
        - { path: ^/oauth/check, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/check_google, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/check_github, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/check_azure, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/check_gitlab, roles: PUBLIC_ACCESS }
        
        - { path: ^/api/tools, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: ROLE_ADMIN
