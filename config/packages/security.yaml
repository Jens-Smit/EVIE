security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\Authenticator\LoginFormAuthenticator
                - App\Security\Authenticator\SSOAuthenticator
            entry_point: App\Security\Authenticator\LoginEntryPoint

            logout:
                path: app_logout
            remember_me:
                secret: '%kernel.secret%'
                # M-7: Lifetime von 7 Tagen (604800) auf 1 Tag (86400) reduziert.
                # Sensible Bereiche (Secrets-Verwaltung, MCP-Server-Verwaltung)
                # sollten zusaetzlich Step-up-Authentifizierung erfordern, da ein
                # kompromittiertes Remember-Me-Cookie sonst den vollen Zugriff
                # fuer die gesamte Lifetime ermoeglicht.
                lifetime: 86400
                path: /

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/datenschutz, roles: PUBLIC_ACCESS }
        - { path: ^/impressum, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/tools, roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

    role_hierarchy:
        # M-6: ROLE_ORG_ADMIN fuer tenant-begrenzte Administration (MCP-Server,
        # Tools) innerhalb der eigenen Organisation, ohne globales ROLE_ADMIN.
        # OrganizationContext::isOrganizationAdmin() prueft auf diese Rolle.
        ROLE_ORG_ADMIN: ROLE_USER
        ROLE_ADMIN: ROLE_ORG_ADMIN
        ROLE_SUPER_ADMIN: ROLE_ADMIN
