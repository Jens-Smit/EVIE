# Symfony AI Bundle Test Configuration for EVIE (test environment)
# Overrides production config to avoid circular dependencies and external API calls.
# NOTE: Do NOT import ../ai.yaml here — Symfony loads config/packages/*.yaml first,
# then config/packages/{env}/*.yaml, so this file naturally overrides production values.

ai:
    # Valid platforms only (the AI bundle restricts platform keys to known types).
    platform:
        mistral:
            api_key: 'test-mistral-key'
        gemini:
            api_key: 'test-gemini-key'

    agent:
        # Test tool_generator: include_tools disabled + no explicit tool services
        # -> breaks the circular dependency (tool_generator -> ToolDefinitionGenerator -> tool_generator).
        tool_generator:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt:
                include_tools: false
            memory: null
            tools:
                enabled: false
                services: {}

        onboarding:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt:
                include_tools: false
            memory: null
            tools: false
            max_tool_calls: 0

        orchestrator:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt:
                include_tools: false
            memory: null
            tools: false
