# Test-only service overrides to make the kernel bootable without external services.
services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Stub Mercure hub for tests (no real Mercure server needed).
    # In prod, config/packages/mercure.yaml provides a real Hub with fallback env vars.
    App\Tests\Stub\NullMercureHub: ~
    Symfony\Component\Mercure\HubInterface: '@App\Tests\Stub\NullMercureHub'
    App\AI\Streaming\StreamingPublisher:
        arguments:
            $mercureHub: '@App\Tests\Stub\NullMercureHub'

    # Kritische EVIE-Services fuer Functional- und E2E-LLM-Tests public machen,
    # damit sie via static::getContainer()->get() abrufbar sind (KernelTestCase
    # erlaubt sonst den Abruf nur von public-Services). Die Argumente werden aus
    # der Haupt-services.yaml (config/services.yaml) geerbt; hier wird lediglich
    # public gesetzt, ohne die Definition zurueckzusetzen.
    App\AI\Agent\OrchestratorDialogService:
        public: true
    App\AI\Skills\ToolDefinitionGenerator:
        public: true
        arguments:
            $userContext: '@App\\Security\\UserContext'
    App\AI\Onboarding\OnboardingFlowManager:
        public: true
        arguments:
            $onboardingAgent: '@ai.agent.onboarding'
    App\AI\Skills\DynamicToolbox:
        public: true
