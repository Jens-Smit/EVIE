# config/packages/messenger_streaming.yaml
# Diese Datei muss in messenger.yaml integriert werden
# Kopiere den Inhalt in config/packages/messenger.yaml

framework:
    messenger:
        serializer:
            default_serializer: messenger.transport.symfony_serializer
            symfony_serializer:
                format: json
                context: {}

        transports:
            async_tools:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000

            streaming:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0

        routing:
            'App\Message\ExecuteToolMessage': async_tools
            'App\Message\StreamToolResponseMessage': streaming
            'App\Message\StartStreamingSessionMessage': streaming
            'App\Message\EndStreamingSessionMessage': streaming
            'App\Message\StreamChunkMessage': streaming

when@dev:
    framework:
        messenger:
            transports:
                async_tools: 'sync://'
                streaming: 'sync://'

when@test:
    framework:
        messenger:
            transports:
                async_tools: 'sync://'
                streaming: 'sync://'
