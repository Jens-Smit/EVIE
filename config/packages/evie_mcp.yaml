evie_mcp:
    cache_ttl: 300
    servers:
        filesystem:
            transport: 'stdio'
            command: 'npx'
            arguments:
                - '-y'
                - '@modelcontextprotocol/server-filesystem'
                - '%kernel.project_dir%/var/mcp-sandbox'

        playwright:
            transport: 'stdio'
            command: 'npx'
            arguments:
                - '-y'
                - '@modelcontextprotocol/server-playwright'

        github:
            transport: 'http'
            url: '%env(GITHUB_MCP_URL)%'
