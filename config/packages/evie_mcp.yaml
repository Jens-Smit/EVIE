evie_mcp:
    cache_ttl: 300
    servers:
        filesystem:
            transport: 'http'
            url: '%env(default::MCP_FILESYSTEM_URL)%'
        playwright:
            transport: 'http'
            url: '%env(default::MCP_PLAYWRIGHT_URL)%'
        github:
            transport: 'http'
            url: '%env(default::GITHUB_MCP_URL)%'
