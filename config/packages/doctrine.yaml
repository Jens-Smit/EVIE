doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            vector: App\Infrastructure\Doctrine\Types\VectorType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            App:
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            driver: 'pdo_sqlite'
            url: 'sqlite:///%kernel.project_dir%/var/test.db'

when@prod:
    doctrine:
        dbal:
            # Connection Pooling (Audit-Finding #4): persistente DB-Verbindungen
            # reduzieren den TCP-Handshake-Overhead pro Request. Fuer echtes
            # Connection Pooling mit Multi-Process-Worker empfiehlt sich
            # zusaetzlich PgBouncer als Sidecar (siehe docs/deployment/).
            options:
                persistent: true
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system