# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    # trusted_proxies is consumed as a JSON array via %env(json:...)%; the
    # "default:" prefix makes the var optional (falls back to empty when the
    # env var is unset), so deployments that don't define TRUSTED_PROXIES still
    # boot. .env.dist ships a valid JSON value; a non-JSON value (e.g. the old
    # comma-separated form) still throws at runtime on purpose.
    trusted_proxies: '%env(default::json:TRUSTED_PROXIES)%'
    trusted_hosts: '%env(default::TRUSTED_HOSTS)%'

    # Form support: registers form.factory, form.registry and related services.
    # Required by AbstractController::createForm() used in SecurityController
    # (login/registration/password-reset) and McpServerController.
    form:
        csrf_protection:
            field_name: _csrf_token

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: false
        cookie_samesite: lax
        # Session-Fixation-Schutz (Audit-Finding #8): Symfony wendet nach
        # erfolgreicher Authentifizierung die SessionAuthenticationStrategy
        # MIGRATE an (Framework-Default), die die Session-ID regeneriert und
        # die Daten auf die neue ID migriert. Eine vorab gesetzte Session-ID
        # wird damit nicht in den authentifizierten Kontext uebernommen.
        # Zusaetzlich: cookie_httponly verhindert JS-Zugriff auf das Session-
        # Cookie (XSS-basierte Session-Hijacking-Mitigation).
        cookie_httponly: true
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
