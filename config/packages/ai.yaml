# Symfony AI Bundle Configuration for EVIE
# This configuration follows the official Symfony AI best practices
# Reference: https://symfony.com/doc/current/ai/bundles/ai-bundle.html
# UPDATED: Added 6 new sub-agents for enterprise functions

ai:
    platform:
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'
        gemini:
            api_key: '%env(GEMINI_API_KEY)%'

    agent:
        # Main orchestrator agent - analyzes requests and delegates to sub-agents
        orchestrator:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt:
                text: |
                    Du bist der Orchestrator-Agent von EVIE, einem selbst-evolvierenden AI-Agenten-System.
                    
                    **Deine Rolle:**
                    - Analysiere User-Anfragen und entscheide, ob ein passendes Tool oder Sub-Agent existiert
                    - Falls kein Tool existiert, schlage die Erstellung eines neuen Tools vor
                    - Delegiere Aufgaben an spezialisierte Sub-Agenten
                    - Führe KEINE Aufgaben direkt aus - du bist nur der Koordinator
                    
                    **Verfügbare Sub-Agenten:**
                    - website_researcher: Für Webseiten-Recherche und Inhaltszusammenfassung
                    - data_analyst: Für Datenanalyse und statistische Auswertungen
                    - code_assistant: Für Code-Analyse, Generierung und Review
                    - document_processor: Für Dokumentenverarbeitung (PDF, Excel, etc.)
                    - communication_manager: Für E-Mails, LinkedIn, Slack und andere Kommunikation
                    - api_integration: Für API-Anbindungen, OAuth, REST, GraphQL
                    - project_manager: Für Projektmanagement und Aufgabenverwaltung
                    - finance_manager: Für Buchhaltung, Rechnungen, Finanzen
                    - hr_manager: Für Personalwesen und Mitarbeiterverwaltung
                    - marketing_manager: Für Marketing, Kampagnen, Social Media
                    - ceo_assistant: Für Strategie, Planung und Entscheidungen
                    
                    **WICHTIG:**
                    - Nutze die verfügbaren Tools und Sub-Agenten optimal
                    - Sei präzise in deiner Analyse
                    - Gib klare Empfehlungen für neue Tools
                    - Antworte IMMER im JSON-Format:
                      {"type": "subagent_delegation|tool_call|no_tool_found|dialog", "subagent": "agent_name", "task": "Aufgabenbeschreibung", "reason": "Begründung"}
                include_tools: true
            memory:
                service: 'App\AI\Onboarding\ContextMemoryProvider'
            tools:
                # MCP Tools
                - service: 'App\Mcp\Toolbox\McpToolExecutor'
                  name: 'mcp_tool_executor'
                  description: 'Führt MCP-Tools aus den konfigurierten Servern aus.'
                
                # Sub-Agenten als Tools registrieren
                - agent: 'website_researcher'
                  name: 'website_researcher'
                  description: 'Sub-Agent für Webseiten-Recherche und Inhaltszusammenfassung'
                
                - agent: 'data_analyst'
                  name: 'data_analyst'
                  description: 'Sub-Agent für Datenanalyse und statistische Auswertungen'
                
                - agent: 'code_assistant'
                  name: 'code_assistant'
                  description: 'Sub-Agent für Code-Analyse, Generierung und Review'
                
                - agent: 'document_processor'
                  name: 'document_processor'
                  description: 'Sub-Agent für Dokumentenverarbeitung'
                
                - agent: 'communication_manager'
                  name: 'communication_manager'
                  description: 'Sub-Agent für Kommunikation (E-Mails, LinkedIn, Slack)'
                
                - agent: 'api_integration'
                  name: 'api_integration'
                  description: 'Sub-Agent für API-Integrationen (OAuth, REST, GraphQL)'
                
                - agent: 'project_manager'
                  name: 'project_manager'
                  description: 'Sub-Agent für Projektmanagement'
                
                - agent: 'finance_manager'
                  name: 'finance_manager'
                  description: 'Sub-Agent für Finanzverwaltung'
                
                - agent: 'hr_manager'
                  name: 'hr_manager'
                  description: 'Sub-Agent für Personalwesen'
                
                - agent: 'marketing_manager'
                  name: 'marketing_manager'
                  description: 'Sub-Agent für Marketing'
                
                - agent: 'ceo_assistant'
                  name: 'ceo_assistant'
                  description: 'Sub-Agent für Strategie, Planung und Entscheidungen'
                
                # Statische Tools
                - { service: 'App\AI\Skills\Tool\WeatherTool' }
                - { service: 'App\AI\Skills\Tool\FileReadTool' }
                - { service: 'App\AI\Skills\Tool\DataAnalyzerTool' }
                - { service: 'App\AI\Skills\Tool\ExcelParserTool' }
                - { service: 'App\AI\Skills\Tool\UserTypeLookupTool' }
                
                # Dynamische Tools aus der Datenbank
                - service: 'App\AI\Skills\Tool\DynamicToolDispatcher'
                  name: 'dynamic_tool_executor'
                  description: 'Führt dynamisch generierte Tools aus der Datenbank aus.'

        # Website Research Agent
        website_researcher:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt:
                text: |
                    Du bist ein spezialisierter Sub-Agent für Webseiten-Recherche und Inhaltszusammenfassung.
                    
                    **Deine Aufgaben:**
                    - Durchsuche Webseiten nach spezifischen Informationen
                    - Extrahiere Impressum, Kontakte, Geschäftszweck, Standort und Branche
                    - Fasse Inhalte strukturiert zusammen
                    - Nutze die verfügbaren MCP-Tools für Web-Recherche
                    
                    **ANTWORTE IMMER IM JSON-FORMAT:**
                    {
                        "type": "website_research_result",
                        "url": "durchsuchte URL",
                        "impressum": {"firma": "...", "adresse": "...", "kontakt": "..."},
                        "kontakte": [{"name": "...", "email": "...", "telefon": "..."}],
                        "geschäftszweck": "...",
                        "standort": "...",
                        "branche": "...",
                        "zusammenfassung": "..."
                    }
            tools:
                - 'Symfony\AI\Agent\Bridge\Firecrawl\Firecrawl'
                - 'Symfony\AI\Agent\Bridge\Tavily\Tavily'
                - { service: 'App\AI\Skills\Tool\FileReadTool' }

        # Data Analysis Agent
        data_analyst:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist ein spezialisierter Sub-Agent für Datenanalyse und statistische Auswertungen.
                Analysiere Daten, erkenne Muster und liefere Erkenntnisse.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"data_analysis_result","findings":["..."],"statistics":{},"summary":"..."}
            tools:
                - { service: 'App\AI\Skills\Tool\DataAnalyzerTool' }
                - { service: 'App\AI\Skills\Tool\ExcelParserTool' }

        # Code Assistant Agent
        code_assistant:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist ein spezialisierter Sub-Agent für Code-Analyse, Generierung und Review.
                Analysiere Code, schlage Verbesserungen vor und generiere neuen Code.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"code_result","analysis":"...","suggestions":["..."],"generated_code":"..."}
            tools: false

        # Document Processor Agent
        document_processor:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist ein spezialisierter Sub-Agent für Dokumentenverarbeitung.
                Verarbeite PDFs, Excel-Dateien und andere Dokumente.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"document_result","extracted_data":{},"summary":"...","file_type":"..."}
            tools:
                - { service: 'App\AI\Skills\Tool\FileReadTool' }
                - { service: 'App\AI\Skills\Tool\ExcelParserTool' }

        # Communication Manager Agent
        communication_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der Communication Manager von EVIE.
                Verwalte E-Mails, Nachrichten, LinkedIn und andere Kommunikation.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"communication_result","action":"send_email|read_emails|send_linkedin_message","status":"success|failed","details":{},"message":"..."}
            tools:
                - { service: 'App\AI\Skills\Tool\EmailTool' }
                - { service: 'App\AI\Skills\Tool\LinkedInTool' }

        # API Integration Agent
        api_integration:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der API Integration Agent von EVIE.
                Binde externe APIs an, verwalte OAuth und Authentifizierung.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"api_result","action":"authenticate|call_api|get_data","endpoint":"...","method":"GET|POST|PUT|DELETE","status":"success|failed","data":{}}
            tools:
                - { service: 'App\AI\Skills\Tool\OAuthTool' }
                - { service: 'App\AI\Skills\Tool\RestApiTool' }

        # Project Manager Agent
        project_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der Project Manager von EVIE.
                Verwalte Aufgaben, Termine, Ressourcen und Projekte.
                ANTWORTE IMMER IM JSON-FORMAT.
            tools: false

        # Finance Manager Agent
        finance_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der Finance Manager von EVIE.
                Verwalte Buchhaltung, Rechnungen, Zahlungen.
                ANTWORTE IMMER IM JSON-FORMAT.
            tools: false

        # HR Manager Agent
        hr_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der HR Manager von EVIE.
                Verwalte Mitarbeiter, Gehälter, Verträge.
                ANTWORTE IMMER IM JSON-FORMAT.
            tools: false

        # Marketing Manager Agent
        marketing_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der Marketing Manager von EVIE.
                Verwalte Kampagnen, Social Media, Content.
                ANTWORTE IMMER IM JSON-FORMAT.
            tools: false

        # CEO Assistant Agent (koordiniert alle anderen)
        ceo_assistant:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der CEO Assistant von EVIE.
                Entwickle Strategien, treffe Entscheidungen, priorisiere Aufgaben.
                Nutze andere Sub-Agenten für spezifische Aufgaben.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"strategy_result|decision|task_prioritization","strategy":{},"decision":{},"tasks":[]}
            tools:
                - agent: 'communication_manager'
                - agent: 'api_integration'
                - agent: 'project_manager'
                - agent: 'finance_manager'
                - agent: 'hr_manager'
                - agent: 'marketing_manager'

        # Fallback Agent
        fallback:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt: |
                Du bist der Fallback-Agent für EVIE.
                Beantworte Fragen direkt, falls kein spezialisierter Agent oder Tool verfügbar ist.
            tools: false

    # Multi-Agent Orchestration
    multi_agent:
        evie:
            orchestrator: 'orchestrator'
            handoffs:
                # Webseiten-Recherche
                website_researcher: 
                    - 'webseite'
                    - 'website'
                    - 'recherche'
                    - 'suche'
                    - 'research'
                    - 'durchsuchen'
                    - 'zusammenfassen'
                    - 'impressum'
                    - 'kontakte'
                    - 'geschäftszweck'
                    - 'standort'
                    - 'branche'
                    - 'visiongastro'
                
                # Datenanalyse
                data_analyst:
                    - 'daten'
                    - 'analyse'
                    - 'statistik'
                    - 'auswertung'
                    - 'zahlen'
                    - 'diagramm'
                
                # Code-Assistenz
                code_assistant:
                    - 'code'
                    - 'programm'
                    - 'skript'
                    - 'funktion'
                    - 'klassen'
                    - 'php'
                    - 'symfony'
                    - 'entwickeln'
                
                # Dokumentenverarbeitung
                document_processor:
                    - 'dokument'
                    - 'pdf'
                    - 'excel'
                    - 'datei'
                    - 'verarbeiten'
                    - 'lesen'
                    - 'extrahieren'
                
                # Kommunikation
                communication_manager:
                    - 'mail'
                    - 'email'
                    - 'nachricht'
                    - 'kommunikation'
                    - 'linkedin'
                    - 'slack'
                    - 'twilio'
                
                # API-Integration
                api_integration:
                    - 'api'
                    - 'oauth'
                    - 'auth'
                    - 'authentifizierung'
                    - 'rest'
                    - 'graphql'
                    - 'endpoint'
                
                # Projektmanagement
                project_manager:
                    - 'projekt'
                    - 'aufgabe'
                    - 'termin'
                    - 'ressource'
                    - 'planung'
                
                # Finanzen
                finance_manager:
                    - 'finanzen'
                    - 'buchhaltung'
                    - 'rechnung'
                    - 'zahlung'
                    - 'geld'
                
                # Personalwesen
                hr_manager:
                    - 'mitarbeiter'
                    - 'personal'
                    - 'gehalt'
                    - 'vertrag'
                    - 'hr'
                
                # Marketing
                marketing_manager:
                    - 'marketing'
                    - 'kampagne'
                    - 'social media'
                    - 'content'
                    - 'werbung'
            fallback: 'fallback'

    # Message Store für Dialogverlauf
    message_store:
        cache:
            evie_dialog:
                service: 'cache.app'
                key: 'evie_dialog'

    # Chat-Konfiguration
    chat:
        evie:
            agent: 'ai.agent.orchestrator'
            message_store: 'ai.message_store.cache.evie_dialog'

    # Vectorizer für Embeddings
    vectorizer:
        mistral_embed:
            platform: 'ai.platform.mistral'
            model: 'mistral-embed'

    # Store für RAG (Retrieval Augmented Generation)
    store:
        postgres:
            onboarding:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: 'onboarding_embeddings'

            # Store für Tool-Definitionen
            tool_definitions:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: 'tool_definitions'

    # Indexer für Dokumenten-Indexierung
    indexer:
        onboarding:
            loader: 'App\AI\Loader\OnboardingLoader'
            vectorizer: 'ai.vectorizer.mistral_embed'
            store: 'ai.store.postgres.onboarding'
