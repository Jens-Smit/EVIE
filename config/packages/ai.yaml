# Symfony AI Bundle Configuration for EVIE
# This configuration follows the official Symfony AI best practices
# Reference: https://symfony.com/doc/current/ai/bundles/ai-bundle.html
# UPDATED: Added Phase 3 optimizations - LLM Prompt Optimization & Onboarding Prompt
# Date: 2026-08-12
# Author: EVIE System

ai:
    platform:
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'
        gemini:
            api_key: '%env(GEMINI_API_KEY)%'

    agent:
        # =====================================================================
        # PHASE 3 OPTIMIZATION: Tool Generator Agent with File-Based Prompt
        # =====================================================================
        # NEW: Dedicated agent for generating precise tool schemas
        # Uses the optimized tool_schema_optimizer.txt prompt file
        # Reference: ROADMAP_PHASE3.md - Measure 8: LLM-Prompt-Optimierung
        tool_generator:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt:
                file: '%kernel.project_dir%/config/prompts/tool_schema_optimizer.txt'
                include_tools: true
            memory:
                service: 'App\AI\Onboarding\ContextMemoryProvider'
            tools:
                # Tool definition generation tools
                - service: 'App\AI\Skills\ToolDefinitionGenerator'
                  name: 'tool_definition_generator'
                  description: 'Generates JSON schemas for new tools based on user requests'
                # Dynamic tool registry for validation
                - service: 'App\AI\Skills\DynamicSkillRegistry'
                  name: 'dynamic_skill_registry'
                  description: 'Registry for dynamic tool definitions'
            # Security settings for tool generation
            security_level: 'high'
            hitl_required: true

        # =====================================================================
        # PHASE 3 OPTIMIZATION: Onboarding Agent with File-Based Prompt
        # =====================================================================
        # NEW: Dedicated agent for structured user onboarding
        # Uses the optimized onboarding_prompt.json file
        # Reference: ROADMAP_PHASE3.md - Measure 10: Onboarding-Prompt optimieren
        onboarding:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt:
                file: '%kernel.project_dir%/config/prompts/onboarding_prompt.json'
                include_tools: false
            memory:
                service: 'App\AI\Onboarding\ContextMemoryProvider'
            tools: false
            # Onboarding-specific settings
            max_tool_calls: 0
            exclude_tool_messages: true

        # =====================================================================
        # MAIN ORCHESTRATOR AGENT - Updated with Phase 3 Improvements
        # =====================================================================
        # UPDATED: Enhanced prompt with better tool delegation and error handling
        orchestrator:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt:
                text: |
                    Du bist der Orchestrator-Agent von EVIE, einem selbst-evolvierenden AI-Agenten-System.
                    
                    **Deine Rolle:**
                    - Analysiere User-Anfragen und entscheide, ob ein passendes Tool oder Sub-Agent existiert
                    - Falls kein Tool existiert, delegiere an den tool_generator-Agent zur Erstellung
                    - Delegiere Aufgaben an spezialisierte Sub-Agenten
                    - Nutze den onboarding-Agent für neue Benutzer
                    - Führe KEINE Aufgaben direkt aus - du bist nur der Koordinator
                    
                    **WICHTIGE NEUERUNGEN (Phase 3):**
                    - Nutze den tool_generator-Agent für neue Tool-Anfragen
                    - Nutze den onboarding-Agent für Benutzer-Onboarding
                    - Alle Tool-Schemata müssen dem EVIE-Standard entsprechen (siehe tool_schema_optimizer.txt)
                    
                    **Verfügbare Sub-Agenten:**
                    - website_researcher: Für Webseiten-Recherche und Inhaltszusammenfassung
                    - data_analyst: Für Datenanalyse und statistische Auswertungen
                    - code_assistant: Für Code-Analyse, Generierung und Review
                    - document_processor: Für Dokumentenverarbeitung (PDF, Excel, etc.)
                    - communication_manager: Für E-Mails, LinkedIn, Slack und andere Kommunikation
                    - api_integration: Für API-Anbindungen, OAuth, REST, GraphQL
                    - project_manager: Für Projektmanagement und Aufgabenverwaltung
                    - finance_manager: Für Buchhaltung, Rechnungen, Finanzen
                    - hr_manager: Für Personalwesen und Mitarbeiterverwaltung
                    - marketing_manager: Für Marketing, Kampagnen, Social Media
                    - ceo_assistant: Für Strategie, Planung und Entscheidungen
                    - tool_generator: Für die Erstellung neuer Tool-Schemata (NEU in Phase 3)
                    - onboarding: Für Benutzer-Onboarding (NEU in Phase 3)
                    
                    **ANTWORTFORMAT:**
                    IMMER im JSON-Format antworten:
                    {
                      "type": "subagent_delegation|tool_call|tool_generation|onboarding|dialog",
                      "subagent": "agent_name",
                      "task": "Aufgabenbeschreibung",
                      "reason": "Begründung",
                      "tool_name": "tool_name" (nur bei tool_generation),
                      "parameters": {} (nur bei tool_generation)
                    }
                    
                    **VERFÜGBARE DIREKTE TOOLS (nutze diese zuerst, kein MCP-Server nötig):**
                    - weather: Liefert Wetterdaten für eine Stadt (Parameter: {"city": "Stadtname"}) - NUTZE DIESES TOOL für Wetterfragen!
                    - file_read: Liest Dateien aus dem Sandbox-Verzeichnis
                    - data_analyzer: Analysiert Daten und erkennt Muster
                    - excel_parser: Parst Excel-Dateien
                    - user_type_lookup: Ermittelt den Nutzertyp
                    - email: Sendet E-Mails
                    - linkedin: LinkedIn-Integration
                    - oauth: OAuth-Authentifizierung
                    - rest_api: Allgemeine REST-API-Aufrufe
                    - dynamic_tool_executor: Führt dynamisch generierte Tools aus
                    
                    **TOOL-GENERIERUNG:**
                    - Falls kein passendes Tool existiert, delegiere an tool_generator-Agent
                    - Der tool_generator erstellt ein neues Tool-Schema basierend auf der Anfrage
                    - Das Schema wird dann in der Datenbank gespeichert und kann nach HITL-Freigabe genutzt werden
                    
                    **ONBOARDING:**
                    - Für neue Benutzer oder bei Anfragen wie "Hilfe", "Anleitung", "Loslegen"
                    - Delegiere an onboarding-Agent für strukturiertes Onboarding
                    
                    **MCP-Tool-Executor (mcp_tool_executor):**
                    - Führt entfernte Tools nur auf diesen konfigurierten Servern aus: filesystem, playwright, github
                    - Erfinde NIEMALS neue Server-Aliase wie "weather_server" oder "weather_api" - diese existieren NICHT!
                    - Für Wetterfragen nutze IMMER das direkte 'weather'-Tool, niemals den MCP-Tool-Executor.
                include_tools: true
            memory:
                service: 'App\AI\Onboarding\ContextMemoryProvider'
            tools:
                # MCP Tools
                - service: 'App\Mcp\Toolbox\McpToolExecutor'
                  name: 'mcp_tool_executor'
                  description: 'Führt MCP-Tools aus den konfigurierten Servern aus.'

                # Statische Tools (NICHT Sub-Agenten!)
                - { service: 'App\AI\Skills\Tool\WeatherTool' }
                - { service: 'App\AI\Skills\Tool\FileReadTool' }
                - { service: 'App\AI\Skills\Tool\DataAnalyzerTool' }
                - { service: 'App\AI\Skills\Tool\ExcelParserTool' }
                - { service: 'App\AI\Skills\Tool\UserTypeLookupTool' }
                - { service: 'App\AI\Skills\Tool\EmailTool' }
                - { service: 'App\AI\Skills\Tool\LinkedInTool' }
                - { service: 'App\AI\Skills\Tool\OAuthTool' }
                - { service: 'App\AI\Skills\Tool\RestApiTool' }
                
                # Dynamische Tools aus der Datenbank
                - service: 'App\AI\Skills\Tool\DynamicToolDispatcher'
                  name: 'dynamic_tool_executor'
                  description: 'Führt dynamisch generierte Tools aus der Datenbank aus.'

        # Website Research Agent
        website_researcher:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt:
                text: |
                    Du bist ein spezialisierter Sub-Agent für Webseiten-Recherche und Inhaltszusammenfassung.
                    
                    **Deine Aufgaben:**
                    - Durchsuche Webseiten nach spezifischen Informationen
                    - Extrahiere Impressum, Kontakte, Geschäftszweck, Standort und Branche
                    - Fasse Inhalte strukturiert zusammen
                    - Nutze die verfügbaren MCP-Tools für Web-Recherche
                    
                    **ANTWORTE IMMER IM JSON-FORMAT:**
                    {
                        "type": "website_research_result",
                        "url": "durchsuchte URL",
                        "impressum": {"firma": "...", "adresse": "...", "kontakt": "..."},
                        "kontakte": [{"name": "...", "email": "...", "telefon": "..."}],
                        "geschäftszweck": "...",
                        "standort": "...",
                        "branche": "...",
                        "zusammenfassung": "..."
                    }
            tools:
                - 'Symfony\AI\Agent\Bridge\Firecrawl\Firecrawl'
                - 'Symfony\AI\Agent\Bridge\Tavily\Tavily'
                - { service: 'App\AI\Skills\Tool\FileReadTool' }

        # Data Analysis Agent
        data_analyst:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist ein spezialisierter Sub-Agent für Datenanalyse und statistische Auswertungen.
                Analysiere Daten, erkenne Muster und liefere Erkenntnisse.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"data_analysis_result","findings":["..."],"statistics":{},"summary":"..."}
            tools:
                - { service: 'App\AI\Skills\Tool\DataAnalyzerTool' }
                - { service: 'App\AI\Skills\Tool\ExcelParserTool' }

        # Code Assistant Agent
        code_assistant:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist ein spezialisierter Sub-Agent für Code-Analyse, Generierung und Review.
                Analysiere Code, schlage Verbesserungen vor und generiere neuen Code.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"code_result","analysis":"...","suggestions":["..."],"generated_code":"..."}
            tools: false

        # Document Processor Agent
        document_processor:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist ein spezialisierter Sub-Agent für Dokumentenverarbeitung.
                Verarbeite PDFs, Excel-Dateien und andere Dokumente.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"document_result","extracted_data":{},"summary":"...","file_type":"..."}
            tools:
                - { service: 'App\AI\Skills\Tool\FileReadTool' }
                - { service: 'App\AI\Skills\Tool\ExcelParserTool' }

        # Communication Manager Agent
        communication_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der Communication Manager von EVIE.
                Verwalte E-Mails, Nachrichten, LinkedIn und andere Kommunikation.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"communication_result","action":"send_email|read_emails|send_linkedin_message","status":"success|failed","details":{},"message":"..."}
            tools:
                - { service: 'App\AI\Skills\Tool\EmailTool' }
                - { service: 'App\AI\Skills\Tool\LinkedInTool' }

        # API Integration Agent
        api_integration:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der API Integration Agent von EVIE.
                Binde externe APIs an, verwalte OAuth und Authentifizierung.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"api_result","action":"authenticate|call_api|get_data","endpoint":"...","method":"GET|POST|PUT|DELETE","status":"success|failed","data":{}}
            tools:
                - { service: 'App\AI\Skills\Tool\OAuthTool' }
                - { service: 'App\AI\Skills\Tool\RestApiTool' }

        # Project Manager Agent
        project_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der Project Manager von EVIE.
                Verwalte Aufgaben, Termine, Ressourcen und Projekte.
                ANTWORTE IMMER IM JSON-FORMAT.
            tools: false

        # Finance Manager Agent
        finance_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der Finance Manager von EVIE.
                Verwalte Buchhaltung, Rechnungen, Zahlungen.
                ANTWORTE IMMER IM JSON-FORMAT.
            tools: false

        # HR Manager Agent
        hr_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der HR Manager von EVIE.
                Verwalte Mitarbeiter, Gehälter, Verträge.
                ANTWORTE IMMER IM JSON-FORMAT.
            tools: false

        # Marketing Manager Agent
        marketing_manager:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der Marketing Manager von EVIE.
                Verwalte Kampagnen, Social Media, Content.
                ANTWORTE IMMER IM JSON-FORMAT.
            tools: false

        # CEO Assistant Agent (koordiniert alle anderen)
        ceo_assistant:
            platform: 'ai.platform.mistral'
            model: 'mistral-large-latest'
            prompt: |
                Du bist der CEO Assistant von EVIE.
                Entwickle Strategien, treffe Entscheidungen, priorisiere Aufgaben.
                Nutze andere Sub-Agenten für spezifische Aufgaben.
                ANTWORTE IMMER IM JSON-FORMAT: {"type":"strategy_result|decision|task_prioritization","strategy":{},"decision":{},"tasks":[]}
            tools:
                - agent: 'communication_manager'
                  description: 'Verwaltet E-Mails, Nachrichten, LinkedIn und andere Kommunikation'
                - agent: 'api_integration'
                  description: 'Bindet externe APIs an, verwaltet OAuth und Authentifizierung'
                - agent: 'project_manager'
                  description: 'Verwalte Aufgaben, Termine, Ressourcen und Projekte'
                - agent: 'finance_manager'
                  description: 'Verwaltet Buchhaltung, Rechnungen, Zahlungen'
                - agent: 'hr_manager'
                  description: 'Verwaltet Mitarbeiter, Gehälter, Verträge'
                - agent: 'marketing_manager'
                  description: 'Verwalte Kampagnen, Social Media, Content'

        # Fallback Agent
        fallback:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt: |
                Du bist der Fallback-Agent für EVIE.
                Beantworte Fragen direkt, falls kein spezialisierter Agent oder Tool verfügbar ist.
            tools: false

    # Multi-Agent Orchestration
    multi_agent:
        evie:
            orchestrator: 'orchestrator'
            handoffs:
                # Onboarding (NEU in Phase 3)
                onboarding:
                    - 'onboarding'
                    - 'anleitung'
                    - 'hilfe'
                    - 'loslegen'
                    - 'start'
                    - 'begin'
                    - 'neu'
                    - 'anfänger'
                    - 'tutorial'
                    - 'erklärung'

                # Tool Generation (NEU in Phase 3)
                tool_generator:
                    - 'neues tool'
                    - 'tool erstellen'
                    - 'tool generieren'
                    - 'schema erstellen'
                    - 'funktion hinzufügen'
                    - 'neue funktion'

                # Webseiten-Recherche
                website_researcher: 
                    - 'webseite'
                    - 'website'
                    - 'recherche'
                    - 'suche'
                    - 'research'
                    - 'durchsuchen'
                    - 'zusammenfassen'
                    - 'impressum'
                    - 'kontakte'
                    - 'geschäftszweck'
                    - 'standort'
                    - 'branche'
                    - 'visiongastro'

                # Datenanalyse
                data_analyst:
                    - 'daten'
                    - 'analyse'
                    - 'statistik'
                    - 'auswertung'
                    - 'zahlen'
                    - 'diagramm'

                # Code-Assistenz
                code_assistant:
                    - 'code'
                    - 'programm'
                    - 'skript'
                    - 'funktion'
                    - 'klassen'
                    - 'php'
                    - 'symfony'
                    - 'entwickeln'

                # Dokumentenverarbeitung
                document_processor:
                    - 'dokument'
                    - 'pdf'
                    - 'excel'
                    - 'datei'
                    - 'verarbeiten'
                    - 'lesen'
                    - 'extrahieren'

                # Kommunikation
                communication_manager:
                    - 'mail'
                    - 'email'
                    - 'nachricht'
                    - 'kommunikation'
                    - 'linkedin'
                    - 'slack'
                    - 'twilio'

                # API-Integration
                api_integration:
                    - 'api'
                    - 'oauth'
                    - 'auth'
                    - 'authentifizierung'
                    - 'rest'
                    - 'graphql'
                    - 'endpoint'

                # Projektmanagement
                project_manager:
                    - 'projekt'
                    - 'aufgabe'
                    - 'termin'
                    - 'ressource'
                    - 'planung'

                # Finanzen
                finance_manager:
                    - 'finanzen'
                    - 'buchhaltung'
                    - 'rechnung'
                    - 'zahlung'
                    - 'geld'

                # Personalwesen
                hr_manager:
                    - 'mitarbeiter'
                    - 'personal'
                    - 'gehalt'
                    - 'vertrag'
                    - 'hr'

                # Marketing
                marketing_manager:
                    - 'marketing'
                    - 'kampagne'
                    - 'social media'
                    - 'content'
                    - 'werbung'

            fallback: 'fallback'

    # Message Store für Dialogverlauf
    message_store:
        cache:
            evie_dialog:
                service: 'cache.app'
                key: 'evie_dialog'

    # Chat-Konfiguration
    chat:
        evie:
            agent: 'ai.agent.orchestrator'
            message_store: 'ai.message_store.cache.evie_dialog'

    # Vectorizer für Embeddings
    vectorizer:
        mistral_embed:
            platform: 'ai.platform.mistral'
            model: 'mistral-embed'

    # Store für RAG (Retrieval Augmented Generation)
    store:
        postgres:
            onboarding:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: 'onboarding_embeddings'

            # Store für Tool-Definitionen
            tool_definitions:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: 'tool_definitions'

    # Indexer für Dokumenten-Indexierung
    indexer:
        onboarding:
            loader: 'App\AI\Loader\OnboardingLoader'
            vectorizer: 'ai.vectorizer.mistral_embed'
            store: 'ai.store.postgres.onboarding'
