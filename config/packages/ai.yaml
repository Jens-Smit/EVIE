ai:
    platform:
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'

    agent:
        orchestrator:            
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt:
                text: 'Du bist der Orchestrator-Agent von EVIE. Du planst und delegierst, führst aber keine Aufgaben direkt aus.'
                include_tools: true
            memory:
                service: 'App\AI\Onboarding\ContextMemoryProvider'
            tools:
                - service: 'mcp.client.playwright.tool.navigate'
                  name: 'browser_navigate'
                  description: 'Öffnet eine URL im kontrollierten Browser-Sandbox-Container.'

                - service: 'mcp.client.playwright.tool.click'
                  name: 'browser_click'
                  description: 'Klickt ein Element auf der aktuell geöffneten Seite.'

                - service: 'mcp.client.filesystem.tool.read'
                  name: 'filesystem_read'
                  description: 'Liest eine Datei aus dem Sandbox-Verzeichnis.'

                - service: 'mcp.client.filesystem.tool.list'
                  name: 'filesystem_list'
                  description: 'Listet Dateien im Sandbox-Verzeichnis auf.'

        research:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            tools: false

    multi_agent:
        evie:
            orchestrator: 'orchestrator'
            handoffs:
                research: ['recherche', 'suche', 'research']
            fallback: 'orchestrator'

    message_store:
        cache:
            evie_dialog:
                service: 'cache.app'
                key: 'evie_dialog'

    chat:
        evie:
            agent: 'ai.agent.orchestrator'
            message_store: 'ai.message_store.cache.evie_dialog'

    vectorizer:
        mistral_embed:
            platform: 'ai.platform.mistral'
            model: 'mistral-embed'

    store:
        postgres:
            onboarding:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: 'onboarding_embeddings'
    indexer:
        onboarding:
            loader: 'App\AI\Loader\OnboardingLoader'
            vectorizer: 'ai.vectorizer.mistral_embed'
            store: 'ai.store.postgres.onboarding'