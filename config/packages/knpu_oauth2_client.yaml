knpu_oauth2_client:
    clients:
        # Google OAuth2
        google:
            type: google
            client_id: '%env(OAUTH_GOOGLE_CLIENT_ID)%'
            client_secret: '%env(OAUTH_GOOGLE_CLIENT_SECRET)%'
            redirect_route: oauth_check_google
            redirect_params: {}
            
        # GitHub OAuth2
        github:
            type: github
            client_id: '%env(OAUTH_GITHUB_CLIENT_ID)%'
            client_secret: '%env(OAUTH_GITHUB_CLIENT_SECRET)%'
            redirect_route: oauth_check_github
            redirect_params: {}
            
        # Azure AD OAuth2 (OIDC)
        azure:
            type: generic
            client_id: '%env(OAUTH_AZURE_CLIENT_ID)%'
            client_secret: '%env(OAUTH_AZURE_CLIENT_SECRET)%'
            redirect_route: oauth_check_azure
            redirect_params: {}
            provider_options:
                authorizationUrl: 'https://login.microsoftonline.com/%env(OAUTH_AZURE_TENANT_ID)%/oauth2/v2.0/authorize'
                tokenUrl: 'https://login.microsoftonline.com/%env(OAUTH_AZURE_TENANT_ID)%/oauth2/v2.0/token'
                userInfoUrl: 'https://graph.microsoft.com/oidc/userinfo'
                
        # GitLab OAuth2
        gitlab:
            type: gitlab
            client_id: '%env(OAUTH_GITLAB_CLIENT_ID)%'
            client_secret: '%env(OAUTH_GITLAB_CLIENT_SECRET)%'
            redirect_route: oauth_check_gitlab
            redirect_params: {}
