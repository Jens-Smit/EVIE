# Admin Routes
# These routes are for the admin dashboard and management interfaces

admin_dashboard:
  path: /admin
  controller: App\Controller\Admin\AdminController::dashboard
  methods: GET

admin_tenants:
  path: /admin/tenants
  controller: App\Controller\Admin\AdminController::tenants
  methods: GET

admin_tenant_detail:
  path: /admin/tenants/{id}
  controller: App\Controller\Admin\AdminController::tenantDetail
  methods: GET
  requirements:
    id: '[a-f0-9]{26}'

admin_users:
  path: /admin/users
  controller: App\Controller\Admin\AdminController::users
  methods: GET

admin_user_detail:
  path: /admin/users/{id}
  controller: App\Controller\Admin\AdminController::userDetail
  methods: GET
  requirements:
    id: '[a-f0-9]{26}'

