# OAuth Routes fuer SSO/OIDC-Integration

# OAuth Check Routes fuer verschiedene Provider
oauth_check:
    path: /oauth/check

oauth_check_google:
    path: /oauth/check/google

oauth_check_github:
    path: /oauth/check/github

oauth_check_azure:
    path: /oauth/check/azure

oauth_check_gitlab:
    path: /oauth/check/gitlab

# OAuth Login Routes fuer Frontend
oauth_login_google:
    path: /oauth/login/google
    controller: App\Controller\Security\OAuthController::login
    methods: GET

oauth_login_github:
    path: /oauth/login/github
    controller: App\Controller\Security\OAuthController::login
    methods: GET

oauth_login_azure:
    path: /oauth/login/azure
    controller: App\Controller\Security\OAuthController::login
    methods: GET

oauth_login_gitlab:
    path: /oauth/login/gitlab
    controller: App\Controller\Security\OAuthController::login
    methods: GET
