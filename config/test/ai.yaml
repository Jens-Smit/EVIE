# Symfony AI Test Configuration for EVIE
#
# Diese Konfiguration ueberschreibt die Production-Agent-Konfiguration fuer
# den Test-Env. Sie importiert die Basis-ai.yaml und behaelt die echten
# Platform-Definitionen (Mistral via env-keys) bei, sodass der Container
# kompiliert. Die LLM-Aufrufe werden im Test deterministisch durch den
# TestStubPass ersetzt, der die Agent-Services durch StubAgent-Instanzen
# austauscht (Blueprint-konform: nativ Symfony AI, keine parallele
# Tool-Infrastruktur, keine Mockdaten im Production-Code).
imports:
    - { resource: '../packages/ai.yaml' }

ai:
    # Die echten Platform-Definitionen werden aus der Basis-ai.yaml uebernommen
    # (Mistral/Gemini via env(default::...)). Die LLM-Stubbing-Logik liegt im
    # TestStubPass, der die Agent-Services im Test-Env ersetzt.

    # Test-Override der Agent-Prompts (kurze, deterministische Prompts).
    # Die tatsaechliche LLM-Antwort liefert der TestStubPass via StubAgent.
    agent:
        tool_generator:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt:
                text: 'Test tool generator prompt. Returns a JSON tool schema.'
                include_tools: false
            keep_tool_messages: true
            tools: false

        onboarding:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt:
                text: 'Test onboarding prompt. Returns JSON onboarding steps.'
                include_tools: false
            max_tool_calls: 0
            keep_tool_messages: true
            tools: false

        orchestrator:
            platform: 'ai.platform.mistral'
            model: 'mistral-small-latest'
            prompt:
                text: |
                    Test orchestrator for EVIE. Returns structured JSON responses
                    for evolution-flow validation.
                include_tools: true
            keep_tool_messages: true
