controllers:
    resource: ../src/Controller/
    type: attribute

agent_dialog:
    path: /api/agent/dialog
    controller: App\Controller\AgentDialogController::dialog
    methods: POST

agent_history:
    path: /api/agent/history/{userIdentifier}
    controller: App\Controller\AgentDialogController::history
    methods: GET

tools_pending:
    path: /api/tools/pending
    controller: App\Controller\ToolApprovalController::pending
    methods: GET

tools_approve:
    path: /api/tools/{id}/approve
    controller: App\Controller\ToolApprovalController::approve
    methods: POST

tools_reject:
    path: /api/tools/{id}/reject
    controller: App\Controller\ToolApprovalController::reject
    methods: POST
