version: '3.8'

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evie_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - DATABASE_URL=postgresql://evie:evie@postgres:5432/evie?serverVersion=15&charset=utf8
      - PGVECTOR_URL=postgresql://evie:evie@postgres:5432/evie?serverVersion=15&charset=utf8
    depends_on:
      - postgres
      - filesystem-mcp
      - playwright-mcp
    networks:
      - evie_network

  # PostgreSQL Database
  postgres:
    image: tanka/postgres-15-pgvector:latest
    container_name: evie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evie
      POSTGRES_USER: evie
      POSTGRES_PASSWORD: evie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - evie_network

  # MCP Services
  filesystem-mcp:
    image: ghcr.io/modelcontextprotocol/filesystem-mcp:latest
    container_name: evie_filesystem_mcp
    restart: unless-stopped
    volumes:
      - .:/data
    ports:
      - "8123:8123"
    networks:
      - evie_network

  playwright-mcp:
    image: ghcr.io/modelcontextprotocol/playwright-mcp:latest
    container_name: evie_playwright_mcp
    restart: unless-stopped
    ports:
      - "8931:8931"
    networks:
      - evie_network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: evie_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - evie_network

volumes:
  postgres_data:

networks:
  evie_network:
    driver: bridge