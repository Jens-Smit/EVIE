services:
    mcp-playwright:
        image: mcr.microsoft.com/playwright/mcp:latest
        container_name: mcp-playwright
        entrypoint: node
        command:
            - /app/cli.js
            - --headless
            - --browser=chromium
            - --no-sandbox
            - --port=8931
            - --host=0.0.0.0
        ports:
            - "8931:8931"          # entfernen, falls Zugriff nur intern über mcp_isolated laufen soll
        networks: [mcp_isolated]
        healthcheck:
            test: ["CMD", "node", "-e", "process.exit(0)"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        restart: unless-stopped

    # Verifiziert: https://github.com/j0hanz/filesystem-mcp
    # Default ist stdio; --port aktiviert HTTP-Transport (siehe README/CLI-Optionen).
    mcp-filesystem:
        image: ghcr.io/j0hanz/filesystem-mcp:latest
        container_name: mcp-filesystem
        command:
            - --port=8123
            - /workspace
        ports:
            - "8123:8123"
        volumes:
            - ./var/mcp-sandbox:/workspace:rw
        networks: [mcp_isolated]
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        restart: unless-stopped

networks:
    mcp_isolated:
        internal: false   