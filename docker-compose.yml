services:
    mcp-playwright:
        build:
            context: .
            dockerfile: Dockerfile.mcp
        command: npx -y @modelcontextprotocol/server-playwright
        networks: [mcp_isolated]

    mcp-filesystem:
        build:
            context: .
            dockerfile: Dockerfile.mcp
        command: npx -y @modelcontextprotocol/server-filesystem /sandbox
        volumes:
            - ./var/mcp-sandbox:/sandbox:rw
        networks: [mcp_isolated]

networks:
    mcp_isolated:
        internal: true