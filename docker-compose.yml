services:
    mcp-playwright:
        image: ghcr.io/modelcontextprotocol/server-playwright:latest
        networks: [mcp_isolated]

    mcp-filesystem:
        image: ghcr.io/modelcontextprotocol/server-filesystem:latest
        volumes:
            - ./var/mcp-sandbox:/sandbox:rw
        networks: [mcp_isolated]

networks:
    mcp_isolated:
        internal: true