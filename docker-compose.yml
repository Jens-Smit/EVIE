services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: evie-php
        volumes:
            - .:/var/www/html
        networks: [mcp_isolated]
        depends_on:
            - evie-db

    nginx:
        image: nginx:latest
        container_name: evie-nginx
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks: [mcp_isolated]
        depends_on:
            - php

    mcp-playwright:
        image: mcr.microsoft.com/playwright/mcp:latest
        container_name: mcp-playwright
        entrypoint: node
        command:
            - /app/cli.js
            - --headless
            - --browser=chromium
            - --no-sandbox
            - --port=8931
            - --host=0.0.0.0
        ports:
            - "8931:8931"
        networks: [mcp_isolated]
        restart: unless-stopped

    mcp-filesystem:
        image: ghcr.io/j0hanz/filesystem-mcp:latest
        container_name: mcp-filesystem
        command:
            - --port=8123
            - /workspace
        ports:
            - "8123:8123"
        volumes:
            - ./var/mcp-sandbox:/workspace:rw
        networks: [mcp_isolated]
        restart: unless-stopped

    evie-db:
        image: postgres:15-alpine
        container_name: evie-db
        environment:
            POSTGRES_DB: evie
            POSTGRES_USER: evie
            POSTGRES_PASSWORD: evie_password
        ports:
            - "5432:5432"
        volumes:
            - evie-db-data:/var/lib/postgresql/data
        networks: [mcp_isolated]
        restart: unless-stopped

networks:
    mcp_isolated:
        internal: false

volumes:
    evie-db-data:
